# Внешняя дверь: сертификат, HTTPS, проксирование на приложение.
# Копируется в /etc/nginx/sites-available/sara, ДОМЕН заменяется на свой.
#
# Зачем вообще nginx: и Telegram, и MAX принимают вебхук только по HTTPS с
# настоящим сертификатом. Держать сертификат внутри приложения — лишняя работа
# и лишний повод для простоя при продлении.

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН;

    # Проверка владения доменом для Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕН/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Голосовые сообщения и фото еды: стандартного ограничения в 1 МБ мало
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # Без этих двух заголовков приложение считает себя доступным по
        # http://127.0.0.1 и пропишет такой адрес вебхука — его не примут
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Распознавание речи и ответы ИИ бывают долгими
        proxy_read_timeout 120s;
    }
}
