name: CI

# Проверяет на каждый push, что воркер собирается и типы в порядке.
on:
  push:
    branches: ["**"]
  pull_request:
  # Кнопка «Run workflow» в GitHub: позволяет выкатить вручную, не делая
  # пустой коммит ради запуска сборки.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (wrangler dry-run)
        run: npx wrangler deploy --dry-run --outdir=dist

      # Дымовой тест приложения: поднимаем страницу с разными сохранёнными
      # настройками и проверяем, что она открывается без ошибок JS. Появился
      # после случая, когда спрятанный в настройках раздел убивал приложение
      # намертво у всех, кто его спрятал.
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke (браузер)
        run: npm run smoke
      # Проверка «как из России без VPN»: все зарубежные адреса молчат.
      # Появилась после случая, когда приложение на смартфоне в РФ
      # открывалось только через VPN из-за трёх внешних ссылок в странице.
      - name: Smoke (без зарубежных доменов)
        run: npm run smoke:ru
      # Кнопка голоса должна реагировать на звук, а не просто краснеть.
      # Проверяется на поддельном микрофоне Chromium.
      - name: Smoke (кнопка голоса)
        run: npm run smoke:mic
      # Прогон живых формулировок через настоящую точку входа бота с
      # выключенным ИИ: что работает здесь — переживёт недоступность модели.
      - name: Аудит голосовых команд
        run: npm run audit

  # ---------------------------------------------------------------------------
  # Деплой. Раньше его тут не было вовсе: CI только собирал воркер вхолостую
  # (--dry-run), а настоящая выкладка жила в кабинете Cloudflare — и «доехало
  # или нет» приходилось угадывать по внешним признакам.
  #
  # Работает, только если в репозитории заданы секреты Cloudflare. Нет их —
  # шаг просто пропускается и ничего не ломает.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/claude/telegram-marketing-bot-p7f3xk'
    runs-on: ubuntu-latest
    # Секреты кладём в env на уровне задачи: в условии `if` у самой задачи
    # контекст secrets недоступен, и попытка проверить его там делает ВЕСЬ файл
    # сборки нерабочим — GitHub молча перестаёт запускать прогоны.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Нет ключей Cloudflare — пропускаем выкладку
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID не заданы — выкладка пропущена."
      - name: Deploy на Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      # Сразу спрашиваем у боевого адреса, какая сборка там теперь. Это и есть
      # ответ на вопрос «деплой доехал?» — виден прямо в логе, без догадок.
      - name: Проверить, что доехало
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 12
          echo "Живая сборка:"
          curl -sS --max-time 20 "https://${PUBLIC_HOST}/version" || echo "адрес не ответил"
        env:
          PUBLIC_HOST: assistant.d-karatsapov.workers.dev
