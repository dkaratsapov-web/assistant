# Конфиг для деплоя на Amvera Cloud (amvera.ru).
# Amvera сам соберёт проект по Dockerfile и запустит.
# Постоянные данные (база SQLite) хранятся в /data — не теряются при передеплое.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
run:
  persistenceMount: /data
  containerPort: 8080
