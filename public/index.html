<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sara</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Светлая тема (по умолчанию) — премиальный монохром */
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f5f5f6;
      --text: #0a0a0a;
      --muted: #86868b;
      --border: rgba(0,0,0,.09);
      --border-strong: rgba(0,0,0,.16);
      --fg: #0a0a0a;            /* «акцент» = контрастный передний план */
      --fg-contrast: #ffffff;   /* текст на --fg */
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --radius: calc(14px * var(--corner-k, 1));
      --radius-sm: calc(10px * var(--corner-k, 1));
      --nav-h: 54px;
      /* Шаг сетки: всё вертикальное расстояние кратно 4, множитель — из настроек */
      --dens-k: 1;
      --s1: calc(4px * var(--dens-k)); --s2: calc(8px * var(--dens-k));
      --s3: calc(12px * var(--dens-k)); --s4: calc(16px * var(--dens-k));
      --s5: calc(20px * var(--dens-k));
      /* Размер картинок и аватаров */
      --img-k: 1;
    }
    /* Настройки: «поменьше движения» выключает переливы и переходы целиком */
    :root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
      animation: none !important; transition: none !important;
    }
    :root[data-theme="dark"] {
      --bg: #0a0a0b;
      --surface: #151517;
      --surface-2: rgba(255,255,255,.055);
      --text: #f6f6f7;
      --muted: #9a9aa1;
      --border: rgba(255,255,255,.10);
      --border-strong: rgba(255,255,255,.20);
      --fg: #f6f6f7;
      --fg-contrast: #0a0a0b;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.5);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body { min-height: 100%; }
    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.45; letter-spacing: -.01em;
      padding-bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
      overflow-x: hidden; transition: background .25s ease, color .25s ease;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }
    button, input, select, textarea { font-family: inherit; }

    /* Header */
    header { padding: 12px 14px 4px; }
    .hrow { display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; }
    .avatar { width: calc(36px * var(--img-k)); height: calc(36px * var(--img-k)); border-radius: 50%; object-fit: cover; flex: none;
      border: 1px solid var(--border); background: var(--surface-2); }
    .hello { flex: 1; min-width: 0; }
    .hello { min-width: 0; }
    /* Имя может быть длинным — пусть переносится на вторую строку, а не обрезается.
       Место есть: подпись под приветствием пустая. */
    .hello .h1 { font-size: 16.5px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hello .sub { color: var(--muted); font-size: 12px; margin-top: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: var(--shadow-sm); transition: transform .12s ease, background .2s ease; }
    .icon-btn:active { transform: scale(.92); }
    .icon-btn svg { width: 17px; height: 17px; }
    /* Зона нажатия 44×44 при меньшем визуальном размере — правило touch target */
    .icon-btn::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; }

    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: .13em; margin: 22px 4px 11px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px; margin-bottom: var(--s2); box-shadow: var(--shadow-sm); }

    /* Home tiles */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
    .tile { border-radius: var(--radius); padding: 13px; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface); box-shadow: var(--shadow); transition: transform .12s ease; }
    .tile:active { transform: scale(.98); }
    .tile.accent { background: var(--fg); border-color: var(--fg); }
    .tile.accent .n, .tile.accent .l { color: var(--fg-contrast); }
    .tile .n { font-size: 23px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
    .tile .l { font-size: 12px; color: var(--muted); margin-top: var(--s1); font-weight: 600; }

    /* CTA */
    .cta { display: flex; align-items: center; gap: 13px; cursor: pointer; background: var(--fg); border: 0;
      border-radius: var(--radius); padding: 12px 14px; margin: var(--s2) 0; box-shadow: var(--shadow-sm); transition: transform .12s ease; }
    .cta:active { transform: scale(.985); }
    .cta .ci { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--fg-contrast) 14%, transparent); }
    .cta .ci svg { width: 20px; height: 20px; color: var(--fg-contrast); }
    .cta .tx { color: var(--fg-contrast); font-weight: 700; font-size: 14.5px; letter-spacing: -.02em; }
    .cta .sm { color: color-mix(in srgb, var(--fg-contrast) 70%, transparent); font-size: 12.5px; font-weight: 500; margin-top: 1px; }
    .cta .arw { margin-left: auto; color: var(--fg-contrast); opacity: .7; }

    /* Agenda */
    .agenda-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .agenda-item:first-child { padding-top: 2px; } .agenda-item:last-child { border-bottom: 0; padding-bottom: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--muted); }
    .dot.strong { background: var(--fg); }
    .agenda-item .t { flex: 1; min-width: 0; }
    .agenda-item .t .ttl { font-weight: 600; }
    .agenda-item .t .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    /* Segmented + chips */
    .seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; margin: 0 0 var(--s2); }
    .seg div { flex: 1; text-align: center; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .18s ease; }
    .seg div.on { color: var(--fg-contrast); background: var(--fg); box-shadow: var(--shadow-sm); }
    .chips { display: flex; gap: 6px; margin-bottom: var(--s2); flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    .chip { padding: 6px 11px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s ease; }
    .chip.on { color: var(--fg-contrast); background: var(--fg); border-color: var(--fg); }

    /* Task / list cards */
    .item { position: relative; }
    .item .top { display: flex; justify-content: space-between; gap: var(--s2); align-items: flex-start; }
    .item .name { font-weight: 700; flex: 1; letter-spacing: -.02em; font-size: 14.5px; line-height: 1.35; }
    .item .name.done { text-decoration: line-through; color: var(--muted); }
    .item.done { opacity: .55; }
    .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; align-items: center; }
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 7px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); font-weight: 600; }
    .pill.strong { color: var(--fg-contrast); background: var(--fg); border-color: var(--fg); }
    .actions { display: flex; gap: var(--s2); margin-top: 10px; }
    .btn { flex: 1; min-height: 40px; padding: 9px 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); transition: transform .1s ease; white-space: nowrap; }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--fg); color: var(--fg-contrast); border-color: var(--fg); }
    .btn.ghost { flex: 0 0 40px; color: var(--muted); padding: 9px 0; }
    .btn.sm { flex: 0 0 auto; padding: 9px 16px; }

    .empty { text-align: center; padding: 32px 16px; color: var(--muted); }
    .empty img { width: calc(96px * var(--img-k)); height: calc(96px * var(--img-k)); object-fit: cover; border-radius: 50%; margin-bottom: 16px; border: 1px solid var(--border); filter: grayscale(.15); }
    .empty .big { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; letter-spacing: -.02em; }
    .loading { text-align: center; padding: 48px; color: var(--muted); font-weight: 500; }

    /* Каркас загрузки: держит форму будущего контента, поэтому при появлении
       данных ничего не прыгает. Переливается медленно, чтобы не рябило. */
    .skel { border-radius: var(--radius-sm); background: var(--surface-2); position: relative; overflow: hidden; }
    .skel::after {
      content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(128,128,140,.14), transparent);
      animation: skel 1.4s ease-in-out infinite;
    }
    @keyframes skel { 100% { transform: translateX(100%); } }
    .skel-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: var(--s4); margin-bottom: var(--s3); }
    .skel-line { height: 13px; margin-bottom: var(--s2); }
    .skel-line:last-child { margin-bottom: 0; }
    .skel-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-bottom: var(--s3); }
    .skel-tile { height: 82px; border-radius: var(--radius); }
    @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }

    /* FAB */
    .fab { position: fixed; right: calc(50% - 300px); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
      width: 46px; height: 46px; border-radius: 50%; background: var(--fg); color: var(--fg-contrast); border: none; cursor: pointer;
      box-shadow: var(--shadow); z-index: 40; display: none; align-items: center; justify-content: center; transition: transform .12s ease; }
    .fab:active { transform: scale(.9); }
    .fab svg { width: 21px; height: 21px; }
    @media (max-width: 676px) { .fab { right: 16px; } }

    /* Bottom nav */
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border); padding: 8px 6px calc(6px + env(safe-area-inset-bottom)); }
    .nav-inner { max-width: 640px; margin: 0 auto; display: flex; }
    .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 9.5px; font-weight: 600; cursor: pointer; padding: 2px; transition: color .15s ease; letter-spacing: -.01em; }
    .nav a svg { width: 19px; height: 19px; }
    .nav a.on { color: var(--text); }

    /* Sheets */
    .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px); background: var(--fg); color: var(--fg-contrast);
      padding: 11px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; max-width: 88vw;
      text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 80; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(2px); display: none; align-items: flex-end; z-index: 60; opacity: 0; transition: opacity .2s ease; }
    .sheet-bg.show { display: flex; opacity: 1; }
    .sheet { background: var(--bg); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.3); transform: translateY(12px); transition: transform .22s cubic-bezier(.2,.8,.2,1);
      /* длинные шторки (админка, профиль) прокручиваются внутри себя, а не уезжают за экран */
      max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .sheet .grabber { position: sticky; top: 0; z-index: 2; background: var(--bg); }
    .sheet-bg.show .sheet { transform: translateY(0); }
    /* Свой диалог подтверждения. Системное окно браузера выбивалось из интерфейса
       и в webview мессенджера выглядело как предупреждение о взломе. */
    .ask-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 80; padding: 24px;
      opacity: 0; transition: opacity .16s ease; }
    .ask-bg.show { display: flex; opacity: 1; }
    .ask { background: var(--surface); width: 100%; max-width: 340px; border-radius: 18px; padding: 20px;
      box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center;
      transform: scale(.94); transition: transform .18s cubic-bezier(.2,.8,.2,1); }
    .ask-bg.show .ask { transform: scale(1); }
    .ask-title { font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
    .ask-text { color: var(--muted); font-size: 13.5px; line-height: 1.45; margin-bottom: 18px; }
    .ask-row { display: flex; flex-direction: column; gap: 8px; }
    .ask-row .btn { width: 100%; }
    /* Кнопка диктовки рядом с полем: тот же рост, что у поля, ничего не съезжает. */
    .mic-btn { flex: none; width: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all .15s ease; }
    .mic-btn:active { transform: scale(.96); }
    .mic-btn.rec { background: #ff3b30; border-color: #ff3b30; color: #fff; }
    .with-mic { display: flex; gap: 8px; align-items: stretch; }
    .with-mic > :first-child { flex: 1; min-width: 0; }
    /* Сетка готовых лиц: три в ряд, выбранное обведено. */
    .faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .face { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .face img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 2px solid transparent; transition: border-color .15s ease, transform .15s ease; }
    .face.on img { border-color: var(--fg); transform: scale(1.04); }
    .face span { font-size: 10.5px; color: var(--muted); font-weight: 600; }
    .face.on span { color: var(--text); }
    .btn.danger { background: #ff3b30; color: #fff; border-color: #ff3b30; }
    .grabber { width: 38px; height: 4px; border-radius: 3px; background: var(--border-strong); margin: 4px auto 16px; }
    .sheet h3 { margin-bottom: 16px; font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: -.01em; }
    .field input, .field select, .field textarea { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 15px; outline: none; transition: border-color .15s ease; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--border-strong); }
    .field select option { color: #111; background: #fff; }  /* читаемо в нативном меню при любой теме */
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--surface-2); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: var(--fg); border: 3px solid var(--surface); box-shadow: var(--shadow-sm); cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--surface);
      background: var(--fg); box-shadow: var(--shadow-sm); cursor: pointer; }
    .field textarea { resize: vertical; min-height: 56px; }
    .check { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--fg); }
    .seg.mini div { padding: 9px; font-size: 13px; }

    /* AI chat */
    .ai-wrap { padding-bottom: 130px; min-height: 44vh; }
    .ai-head { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .msg { max-width: 85%; padding: 11px 14px; border-radius: 18px; margin: 9px 0; font-size: 14.5px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.user { margin-left: auto; background: var(--fg); color: var(--fg-contrast); border-bottom-right-radius: 6px; }
    .msg.ai { margin-right: auto; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; box-shadow: var(--shadow-sm); }
    .msg.ai.think { color: var(--muted); font-style: italic; }
    .chatbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 2px + env(safe-area-inset-bottom)); z-index: 45; padding: 8px 14px 10px;
      background: linear-gradient(to top, var(--bg) 62%, transparent); }
    .chatbar-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 5px 5px 5px 18px; box-shadow: var(--shadow); }
    .chatbar input { flex: 1; border: 0; background: transparent; color: var(--text); font-size: 15px; outline: none; padding: 10px 0; }
    .chatbar button { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--fg); color: var(--fg-contrast); display: flex; align-items: center; justify-content: center; transition: transform .1s ease; }
    .chatbar button:active { transform: scale(.9); } .chatbar button:disabled { opacity: .4; }
    .chatbar button svg { width: 18px; height: 18px; }

    .link { color: var(--text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <img id="avatar" class="avatar" alt="Сара" style="cursor:pointer" onclick="openSara()" title="Настройки Сары">
      <div class="hello">
        <div class="h1" id="greeting">Sara</div>
        <div class="sub" id="subtitle"></div>
      </div>
      <button class="icon-btn" id="notif-btn" aria-label="Уведомления" onclick="openNotif()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      <button class="icon-btn" id="admin-btn" aria-label="Доступы" style="display:none" onclick="openAdmin()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3 2.9-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><path d="M17 8v6M14 11h6"/></svg></button>

  <script>
    /**
     * Страховка от «вечной загрузки». Приложение запоминает настройки на устройстве,
     * поэтому одна ошибка при старте повторялась бы при каждом запуске, и человек
     * не смог бы ни выйти, ни рассказать, что случилось. Ловим такую ошибку,
     * показываем понятный экран с кнопкой сброса и шлём отчёт себе.
     */
    (function () {
      var booted = false;
      window.__appBooted = function () { booted = true; };
      function report(what) {
        try {
          navigator.sendBeacon
            ? navigator.sendBeacon("/api/diag/client-error", new Blob([JSON.stringify(what)], { type: "application/json" }))
            : fetch("/api/diag/client-error", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(what) });
        } catch (e) {}
      }
      function rescue(message) {
        report({ message: String(message).slice(0, 500), href: location.href.slice(0, 200), ua: navigator.userAgent.slice(0, 200), at: new Date().toISOString() });
        if (booted) return;                       // приложение уже работает — не мешаем
        var view = document.getElementById("view");
        if (!view) return;
        view.innerHTML =
          '<div style="padding:24px;text-align:center;font-family:system-ui,sans-serif">' +
          '<div style="font-size:17px;font-weight:700;margin-bottom:8px">Приложение не смогло открыться</div>' +
          '<div style="color:#86868b;font-size:13.5px;line-height:1.5;margin-bottom:18px">Скорее всего, виноваты сохранённые настройки внешнего вида. Сбрось их — данные, задачи и здоровье это не затронет.</div>' +
          '<button id="rescue-reset" style="width:100%;padding:14px;border:0;border-radius:12px;background:#0a0a0a;color:#fff;font-weight:700;font-size:15px">Сбросить настройки и перезапустить</button>' +
          '<div style="color:#86868b;font-size:11px;margin-top:14px;word-break:break-all">' + String(message).slice(0, 200) + '</div></div>';
        var btn = document.getElementById("rescue-reset");
        if (btn) btn.onclick = function () {
          btn.textContent = "Сбрасываю…";
          try { localStorage.removeItem("sara-prefs"); } catch (e) {}
          // Серверную копию тоже надо вернуть к норме: иначе она приедет обратно
          // при первом же запуске и человек снова упрётся в этот экран.
          var restart = function () { location.replace(location.pathname); };
          try {
            fetch("/api/prefs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ scale: 100, density: "normal", images: "normal", corners: "normal", theme: "auto", motion: true, haptic: true, startTab: "home", hidden: [], callMe: "", botName: "Сара" }),
            }).then(restart, restart);
            setTimeout(restart, 3000);            // сеть молчит — всё равно перезапускаемся
          } catch (e) { restart(); }
        };
      }
      window.addEventListener("error", function (e) { rescue(e.message || e.error); });
      window.addEventListener("unhandledrejection", function (e) { rescue((e.reason && e.reason.message) || e.reason); });
    })();
  </script>
  <script>
    // Приложение открывается и в Telegram, и по ссылке из MAX (там объекта Telegram нет) —
    // подставляем заглушку с теми же методами, чтобы код ниже не расходился на две ветки.
    const noop = () => {};
    const tg = (window.Telegram && window.Telegram.WebApp) || {
      // Вне Telegram (MAX, браузер) объекта нет — заглушка должна повторять ВЕСЬ используемый
      // API, иначе приложение падает на первом же вызове и остаётся на «Загрузка…».
      ready: noop, expand: noop, close: noop,
      initData: "", initDataUnsafe: {}, colorScheme: "",
      setHeaderColor: noop, setBackgroundColor: noop, disableVerticalSwipes: noop,
      HapticFeedback: { impactOccurred: noop, notificationOccurred: noop },
      BackButton: { show: noop, hide: noop, onClick: noop, offClick: noop },
      MainButton: { show: noop, hide: noop, setText: noop, onClick: noop },
      showAlert: (msg, cb) => { toast(msg); if (cb) cb(); },
      showConfirm: (msg, cb) => ask(msg).then((ok) => cb(ok)),
      openLink: (url) => window.open(url, "_blank", "noopener"),
    };
    tg.ready(); tg.expand();
    // На мобильном Telegram перехватывает вертикальный свайп и мешает вводу в поля — отключаем
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    const INIT = tg.initData || "";
    // Разбор данных запуска кэшируем. Объявление именно здесь: bridgeScan зовут
    // при старте, выше по файлу, и «let» ниже по коду был бы ещё не инициализирован.
    let launchScan = null;
    // Токен сессии из MAX: приходит в ссылке (?max=…) и запоминается на устройстве
    const MAX_KEY = "sara-max-session";
    const MAX_SESSION = (() => {
      try {
        // 1) токен из кнопки бота — как его ни назови, его находит bridgeScan,
        // 2) сохранённый с прошлого входа. Важно взять его ДО первого запроса:
        // иначе /api/me получит 401 и приложение уйдёт на лишнюю перезагрузку.
        let t = bridgeScan().startParam || "";
        if (t.length < 16) {
          t = "";
        }
        if (t) {
          localStorage.setItem(MAX_KEY, t);
          history.replaceState(null, "", location.pathname); // прячем токен из адресной строки
          return t;
        }
        return localStorage.getItem(MAX_KEY) || "";
      } catch (e) {
        return "";
      }
    })();
    const AUTH_HEADERS = { "X-Telegram-Init-Data": INIT, ...(MAX_SESSION ? { "X-Max-Session": MAX_SESSION } : {}) };
    const SARA = "https://d8j0ntlcm91z4.cloudfront.net/user_3FDW4xDpfIw798Hq1MYcfG8Ze1n/hf_20260727_104316_1c7a9ff3-3430-4ede-aff4-062cc444784f_min.webp";

    /** Короткое уведомление внизу экрана — замена системного алерта вне Telegram. */
    function toast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.className = "toast";
        document.body.appendChild(el);
      }
      el.textContent = String(msg);
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2600);
    }

    const $ = (id) => document.getElementById(id);
    const view = $("view");
    const setHTML = (id, html) => { const el = $(id); if (el) el.innerHTML = html; };
    // Надёжное подтверждение (в Telegram window.confirm часто не работает)
    /**
     * Спросить подтверждение своим диалогом. Раньше показывалось системное окно
     * браузера — в мессенджере оно выглядело чужеродно и пугало адресом сайта.
     * @param msg вопрос; @param opts.ok надпись на кнопке действия; @param opts.danger красная кнопка
     */
    function ask(msg, opts = {}) {
      return new Promise((res) => {
        const bg = $("ask-bg"), row = $("ask-row");
        if (!bg || !row) { res(true); return; }
        const [title, ...rest] = String(msg).split("\n");
        $("ask-title").textContent = title;
        $("ask-text").textContent = rest.join(" ") || opts.text || "";
        $("ask-text").style.display = $("ask-text").textContent ? "" : "none";
        row.innerHTML =
          `<button class="btn ${opts.danger ? "danger" : "primary"}" id="ask-ok">${esc(opts.ok || "Да")}</button>` +
          `<button class="btn" id="ask-no">${esc(opts.cancel || "Отмена")}</button>`;
        const close = (v) => {
          bg.classList.remove("show");
          document.removeEventListener("keydown", onKey);
          res(v);
        };
        const onKey = (e) => { if (e.key === "Escape") close(false); if (e.key === "Enter") close(true); };
        $("ask-ok").onclick = () => { haptic(); close(true); };
        $("ask-no").onclick = () => close(false);
        bg.onclick = (e) => { if (e.target === bg) close(false); };
        document.addEventListener("keydown", onKey);
        bg.classList.add("show");
      });
    }
    const esc = (s) => (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const haptic = (t = "light") => { if (prefs && !prefs.haptic) return; try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

    /* ---------- Тема ---------- */
    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>';
    const THEME_KEY = "sara-theme";
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      $("theme-btn").innerHTML = t === "dark" ? SUN : MOON;
      const bg = t === "dark" ? "#0a0a0b" : "#ffffff";
      try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
      localStorage.setItem(THEME_KEY, t);
    }
    const systemTheme = () => tg.colorScheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    let theme = localStorage.getItem(THEME_KEY) || systemTheme();
    applyTheme(theme);
    $("theme-btn").onclick = () => {
      haptic();
      theme = theme === "dark" ? "light" : "dark";
      applyTheme(theme);
      // ручное переключение перебивает «как в системе»
      if (prefs.theme !== theme) savePrefs({ theme });
    };

    /* ---------- Настройки внешнего вида ---------- */
    const PREFS_KEY = "sara-prefs";
    const PREFS_DEFAULT = {
      scale: 100, density: "normal", images: "normal", corners: "normal", theme: "auto",
      motion: true, haptic: true, startTab: "home", hidden: [], callMe: "", botName: "Сара",
      avatar: "", tone: "friendly", address: "ty", emoji: true, search: true,
    };
    // из памяти устройства — чтобы применить до ответа сервера и не мигать
    let prefs = (() => {
      try { return { ...PREFS_DEFAULT, ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") }; }
      catch (e) { return { ...PREFS_DEFAULT }; }
    })();

    const DENS_K = { compact: 0.8, normal: 1, roomy: 1.25 };
    const IMG_K = { small: 0.75, normal: 1, large: 1.35 };
    const CORNER_K = { sharp: 0.35, normal: 1, soft: 1.6 };
    const TAB_NAMES = { home: "Главная", tasks: "Задачи", calendar: "Календарь", health: "Здоровье", clients: "Клиенты", ai: "Сара" };

    /** Раскладывает настройки по переменным темы — вся вёрстка уже на них держится. */
    function applyPrefs() {
      const root = document.documentElement;
      root.style.setProperty("--dens-k", DENS_K[prefs.density] ?? 1);
      root.style.setProperty("--img-k", IMG_K[prefs.images] ?? 1);
      root.style.setProperty("--corner-k", CORNER_K[prefs.corners] ?? 1);
      root.style.zoom = (prefs.scale || 100) / 100;          // масштаб всего интерфейса
      root.setAttribute("data-motion", prefs.motion ? "on" : "off");
      const want = prefs.theme === "auto" ? systemTheme() : prefs.theme;
      if (want !== theme) { theme = want; applyTheme(theme); }
      applyHiddenTabs();
      applyGreeting();
      const ava = document.getElementById("avatar");
      if (ava) ava.src = avatarSrc(prefs.avatar);
    }

    /**
     * Приветствие в шапке. Имя берём из настроек — поэтому зовём и при запуске,
     * и сразу после их изменения, иначе новое имя появлялось бы только назавтра.
     */
    function applyGreeting() {
      const el = document.getElementById("greeting");
      if (!el) return;
      const name = (prefs.callMe || "").trim() || tg.initDataUnsafe?.user?.first_name || "";
      const hour = new Date().getHours();
      const hi = hour < 6 ? "Доброй ночи" : hour < 12 ? "Доброе утро" : hour < 18 ? "Добрый день" : "Добрый вечер";
      el.textContent = `${hi}${name ? ", " + name : ""}`;
    }

    /** Прячет разделы, которые человек отключил, но никогда — тот, где он сейчас. */
    function applyHiddenTabs() {
      document.querySelectorAll(".nav a").forEach((a) => {
        const hide = prefs.hidden.includes(a.dataset.tab) && a.dataset.tab !== tab;
        a.style.display = hide ? "none" : "";
      });
    }

    /** Сохраняем: сразу на устройство (мгновенно) и на сервер (чтобы жило на всех). */
    async function savePrefs(patch) {
      prefs = { ...prefs, ...patch };
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
      applyPrefs();
      try {
        const saved = await api("/prefs", { method: "POST", body: JSON.stringify(prefs) });
        prefs = { ...prefs, ...saved };
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      } catch (e) {
        toast("Настройки применены, но не сохранились на сервере");
      }
    }

    /* ---------- Состояние ---------- */
    let tab = "home";
    let taskScope = "work";
    let taskStage = "open";
    let clientsCache = [];
    let tasksCache = [];
    let eventsCache = [];
    let contactsCache = [];
    let supCache = [];
    let me = {};
    let sheetOpen = false;
    const navStack = ["home"];

    // Настройки применяем здесь, а не раньше: applyHiddenTabs читает tab,
    // и вызов до объявления состояния ронял всё приложение.
    applyPrefs();

    /* ---------- API ---------- */
    async function api(path, opts = {}) {
      const res = await fetch("/api" + path, {
        ...opts,
        headers: { "Content-Type": "application/json", ...AUTH_HEADERS, ...(opts.headers || {}) },
      });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.status); }
      return res.json();
    }

    function fmtDue(iso) {
      if (!iso) return { over: false, txt: "" };
      const dd = new Date(iso), now = new Date();
      const days = Math.round((new Date(iso).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000);
      const t = dd.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const dm = dd.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
      if (dd < now) return { over: true, txt: "просрочено · " + dm };
      if (days === 0) return { over: false, txt: "сегодня " + t };
      if (days === 1) return { over: false, txt: "завтра " + t };
      return { over: false, txt: dm + " " + t };
    }
    function fmtEv(iso) { return new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    const p2 = (n) => String(n).padStart(2, "0");
    function isoToLocalInput(iso) { const d = new Date(iso); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; }
    function isoToDueText(iso) { if (!iso) return ""; const d = new Date(iso); return `${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
    const MON_RU = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
    function money(v) {
      v = (v || "").trim();
      if (/^\d[\d\s]*$/.test(v)) return v.replace(/\s/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
      return esc(v);
    }
    function fmtBd(bd) { if (!bd) return ""; const p = bd.split("-"); const mo = p.length === 3 ? +p[1] : +p[0]; const d = p.length === 3 ? +p[2] : +p[1]; if (!mo || !d) return bd; return `${d} ${MON_RU[mo-1]}`; }
    function emptyBox(big, small) { return `<div class="empty"><img src="${SARA}" alt=""><div class="big">${big}</div><div>${small}</div></div>`; }
    function err(e) {
      const m = String(e.message || e);
      if (m === "no_access") return emptyBox("Нет доступа", "Получи доступ у владельца бота.");
      return `<div class="empty errbox"><div class="big">Ошибка</div><div>${esc(m)}</div></div>`;
    }
    const ARROW = '<svg class="arw" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

    /* ---------- Переходы между вкладками ---------- */
    // Вкладка помнит, как выглядела в прошлый раз. При возврате показываем её
    // сразу и молча обновляем данные — вместо белого экрана «Загрузка…».
    const tabHtml = {};
    function restoreTab(t) {
      const cached = tabHtml[t];
      if (!cached) return false;
      view.innerHTML = cached;
      return true;
    }
    function rememberTab(t) {
      // ИИ-вкладку не кэшируем: там живой обработчик ввода, разметкой его не вернуть
      // не запоминаем каркас и экран ошибки — иначе они прилипнут к вкладке
      if (t === "ai" || tab !== t) return;
      if (view.querySelector(".loading, .skel, .errbox")) return;
      tabHtml[t] = view.innerHTML;
    }

    /**
     * Каркас под конкретный экран. Показываем только при первом заходе:
     * дальше вкладка помнит свой прошлый вид и подменять его нечем.
     */
    function skeleton(kind) {
      const line = (w) => `<div class="skel skel-line" style="width:${w}"></div>`;
      const card = (...ws) => `<div class="skel-card">${ws.map(line).join("")}</div>`;
      if (kind === "home") {
        return `<div class="skel-tiles"><div class="skel skel-tile"></div><div class="skel skel-tile"></div></div>` +
               `<div class="skel skel-tile" style="height:64px;margin-bottom:var(--s3)"></div>` +
               card("62%", "38%") + card("70%", "44%");
      }
      if (kind === "list") return card("74%", "40%") + card("58%", "34%") + card("66%", "42%");
      if (kind === "health") {
        return `<div class="skel-tiles"><div class="skel skel-tile"></div><div class="skel skel-tile"></div></div>` +
               card("54%", "80%", "40%") + card("64%", "36%");
      }
      return card("70%", "45%") + card("55%", "35%");
    }

    /* ---------- Экраны ---------- */
    async function renderHome(warm = tabHtml.home !== undefined) {
      const mine = tab;
      if (!warm) view.innerHTML = skeleton("home");
      try {
        const d = await api("/home");
        if (tab !== mine) return;
        let h = `<div class="tiles">
          <div class="tile accent" onclick="go('tasks','work')"><div class="n">${d.counts.work}</div><div class="l">Рабочие задачи</div></div>
          <div class="tile" onclick="go('tasks','personal')"><div class="n">${d.counts.personal}</div><div class="l">Личные задачи</div></div>
        </div>`;
        h += `<div class="cta" onclick="go('ai')">
          <div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3L12 3Z"/></svg></div>
          <div><div class="tx">Спросить Сару</div><div class="sm">Задачи, встречи, здоровье и любой вопрос</div></div>${ARROW}</div>`;
        const tOnly = (iso) => new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        const overdue = d.tasks.filter((t) => t.overdue);
        const todayTasks = d.tasks.filter((t) => !t.overdue);
        // Просрочено — отдельно
        if (overdue.length) {
          h += `<div class="section-title">⚠️ Просрочено</div><div class="card">`;
          overdue.forEach((t) => {
            const due = fmtDue(t.due_at);
            h += `<div class="agenda-item"><div class="dot strong"></div><div class="t"><div class="ttl">${esc(t.title)}</div><div class="m" style="color:#ff6b6b">${due.txt} · ${t.scope === "personal" ? "личное" : "работа"}</div></div></div>`;
          });
          h += `</div>`;
        }
        // На сегодня — строго сегодняшнее (не просроченное)
        h += `<div class="section-title">На сегодня</div>`;
        if (!todayTasks.length && !d.events.length) {
          h += `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Всё спокойно. Свободный день ✦</div></div>`;
        } else {
          h += `<div class="card">`;
          todayTasks.forEach((t) => {
            const due = fmtDue(t.due_at);
            h += `<div class="agenda-item"><div class="dot"></div><div class="t"><div class="ttl">${esc(t.title)}</div><div class="m">${due.txt} · ${t.scope === "personal" ? "личное" : "работа"}</div></div></div>`;
          });
          d.events.forEach((e) => {
            h += `<div class="agenda-item"><div class="dot strong"></div><div class="t"><div class="ttl">${esc(e.title)}</div><div class="m">встреча · сегодня ${tOnly(e.starts_at)}${e.client ? " · 📁 " + esc(e.client) : ""}${e.location ? " · " + esc(e.location) : ""}</div></div></div>`;
          });
          h += `</div>`;
        }
        if (d.upcomingEvents && d.upcomingEvents.length) {
          h += `<div class="section-title">Ближайшие встречи</div><div class="card">`;
          d.upcomingEvents.forEach((e) => {
            h += `<div class="agenda-item"><div class="dot ev"></div><div class="t"><div class="ttl">${esc(e.title)}</div><div class="m">${fmtEv(e.starts_at)}${e.client ? " · 📁 " + esc(e.client) : ""}${e.location ? " · " + esc(e.location) : ""}</div></div></div>`;
          });
          h += `</div>`;
        }
        h += `<div class="section-title">Здоровье сегодня</div><div id="health-card"><div class="card"><div class="loading">…</div></div></div>`;
        h += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center"><span>Дни рождения</span><span onclick="openContacts()" style="color:var(--muted);font-size:12px;font-weight:600;cursor:pointer">Контакты →</span></div>`;
        if (d.birthdays.length) {
          h += `<div class="card">`;
          d.birthdays.forEach((b) => {
            const when = b.in_days === 0 ? "сегодня" : b.in_days === 1 ? "завтра" : "через " + b.in_days + " дн.";
            h += `<div class="agenda-item" onclick="openContacts()"><div class="dot"></div><div class="t"><div class="ttl">${esc(b.name)}</div><div class="m">${when} · ${fmtBd(b.date)}</div></div></div>`;
          });
          h += `</div>`;
        } else {
          h += `<div class="card" onclick="openContacts()"><div style="color:var(--muted);text-align:center;padding:6px">Нет ближайших ДР. Нажми, чтобы добавить контакт.</div></div>`;
        }
        view.innerHTML = h;
        // дожидаемся карточки здоровья: иначе вкладка запомнится с заглушкой внутри
        await renderHealthCard();
      } catch (e) { view.innerHTML = err(e); }
    }

    /* ---------- Здоровье: еда/калории + вода ---------- */
    async function renderHealthCard() {
      try {
        const d = await api("/health");
        if (tab !== "home") return;
        const el = $("health-card"); if (!el) return;
        const kc = d.kcal, w = d.water;
        const bar = (pct) => `<div style="height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:4px"><div style="height:100%;width:${Math.min(100, pct)}%;background:var(--fg)"></div></div>`;
        const kpct = kc.goal ? Math.round(kc.consumed / kc.goal * 100) : 0;
        const wpct = w.goal ? Math.round(w.ml / w.goal * 100) : 0;
        el.innerHTML = `<div class="card" onclick="switchTab('health')">
            <div style="display:flex;justify-content:space-between;align-items:baseline"><b>🔥 ${kc.consumed} / ${kc.goal} ккал</b><span style="color:var(--muted);font-size:12px">Б ${kc.protein} · Ж ${kc.fat} · У ${kc.carbs}</span></div>
            ${bar(kpct)}
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><b>💧 ${(w.ml/1000).toFixed(1)} / ${(w.goal/1000).toFixed(1)} л</b><span style="color:var(--muted);font-size:12px">${wpct}%</span></div>
            ${bar(wpct)}
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn" style="flex:1" onclick="waterQuick(250)">＋ стакан</button>
            <button class="btn" style="flex:1" onclick="waterQuick(500)">＋ 0.5 л</button>
            <button class="btn primary" style="flex:1" onclick="openFoodAdd()">＋ еда</button>
          </div>`;
      } catch (e) { const el = $("health-card"); if (el) el.innerHTML = ""; }
    }
    window.waterQuick = async (ml) => { haptic(); try { await api("/health/water", { method: "POST", body: JSON.stringify({ ml }) }); } catch (e) {} if (tab === "home") renderHealthCard(); };
    const mealDefault = () => { const hh = new Date().getHours(); return hh >= 5 && hh < 11 ? "breakfast" : hh >= 11 && hh < 16 ? "lunch" : hh >= 16 && hh < 22 ? "dinner" : "snack"; };
    let recentFoods = [];
    window.openFoodAdd = async () => {
      const md = mealDefault();
      const opt = (v, l) => `<option value="${v}" ${v === md ? "selected" : ""}>${l}</option>`;
      openSheet(`<h3>Что съели?</h3>
        <div class="field"><label>Опиши блюдо — калории и БЖУ оценит ИИ</label><div class="with-mic"><input id="f-food" placeholder="напр. тарелка борща с хлебом" autocomplete="off">${micButton("f-food")}</div></div>
        <div class="field"><label>Приём пищи</label><select id="f-meal">${opt("breakfast","🌅 Завтрак")}${opt("lunch","☀️ Обед")}${opt("dinner","🌙 Ужин")}${opt("snack","🍎 Перекус")}</select></div>
        <div id="food-recent"></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" id="food-save" onclick="saveFood()">Добавить</button></div>`);
      setTimeout(() => { const i = $("f-food"); if (i) i.focus(); }, 150);
      try {
        const { recent } = await api("/health/recent");
        recentFoods = recent || [];
        const box = $("food-recent");
        if (box && recentFoods.length) box.innerHTML = `<label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Часто едите — тап, чтобы добавить</label><div class="chips">${recentFoods.map((r, i) => `<div class="chip" onclick="quickFood(${i})">${esc(r.title)} · ${r.kcal}</div>`).join("")}</div>`;
      } catch (e) {}
    };
    window.quickFood = async (i) => {
      const r = recentFoods[i]; if (!r) return;
      const meal = $("f-meal") ? $("f-meal").value : r.meal;
      try { await api("/health/food", { method: "POST", body: JSON.stringify({ title: r.title, kcal: r.kcal, protein: r.protein, fat: r.fat, carbs: r.carbs, meal }) }); }
      catch (e) { return tg.showAlert("Ошибка"); }
      closeSheet(); if (tab === "health") renderHealth(); if (tab === "home") renderHealthCard();
    };
    window.saveFood = async () => {
      const title = ($("f-food").value || "").trim(); if (!title) return tg.showAlert("Опиши, что съел");
      const meal = $("f-meal") ? $("f-meal").value : undefined;
      const btn = $("food-save"); if (btn) { btn.disabled = true; btn.textContent = "Оцениваю…"; }
      try { await api("/health/food", { method: "POST", body: JSON.stringify({ title, meal }) }); }
      catch (e) { if (btn) { btn.disabled = false; btn.textContent = "Добавить"; } return tg.showAlert("Не удалось оценить: " + (e.message || e)); }
      closeSheet();
      if (tab === "home") renderHealthCard();
      if (tab === "health") renderHealth();
    };

    /* ---------- Раздел «Здоровье» (отдельный экран) ---------- */
    let healthOffset = 0; // 0 — сегодня, -1 — вчера …
    const healthDateStr = (off) => { const d = new Date(); d.setDate(d.getDate() + off); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; };
    window.healthNav = (delta) => { const n = healthOffset + delta; if (n > 0) return; healthOffset = n; renderHealth(); };
    async function renderHealth(warm = tabHtml.health !== undefined) {
      if (!warm) view.innerHTML = skeleton("health");
      try {
        const d = await api(`/health?date=${healthDateStr(healthOffset)}`);
        if (tab !== "health") return;
        const kc = d.kcal, w = d.water, today = healthOffset === 0;
        const label = healthOffset === 0 ? "Сегодня" : healthOffset === -1 ? "Вчера" : (() => { const dt = new Date(); dt.setDate(dt.getDate()+healthOffset); return dt.toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "long" }); })();
        const bar = (pct) => `<div style="height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:5px"><div style="height:100%;width:${Math.min(100,pct)}%;background:var(--fg)"></div></div>`;
        const streakTxt = d.streak ? `🔥 ${d.streak} ${d.streak % 10 === 1 && d.streak % 100 !== 11 ? "день" : (d.streak % 10 >= 2 && d.streak % 10 <= 4 && (d.streak % 100 < 10 || d.streak % 100 >= 20) ? "дня" : "дней")} подряд` : "";
        let h = `<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 2px 4px">
            <button class="icon-btn" onclick="healthNav(-1)">‹</button>
            <div style="font-weight:800;letter-spacing:-.02em">${label}</div>
            <button class="icon-btn" onclick="healthNav(1)" ${today ? "disabled style=opacity:.3" : ""}>›</button></div>`;
        if (today && streakTxt) h += `<div style="text-align:center;margin-bottom:10px;color:var(--muted);font-size:13px">${streakTxt}</div>`;
        if (today) h += `<button class="btn" style="width:100%;margin-bottom:8px" onclick="openProfile()">👤 Мой профиль — для точных меню и советов</button>`;
        // КБЖУ
        const remain = kc.goal - kc.consumed;
        const mbar = (v, g) => bar(g ? v / g * 100 : 0);
        h += `<div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline"><b>🔥 ${kc.consumed} / ${kc.goal} ккал</b><span style="color:var(--muted);font-size:12px">${remain >= 0 ? `осталось ${remain}` : `перебор ${-remain}`}</span></div>${bar(kc.goal?kc.consumed/kc.goal*100:0)}
            <div style="display:flex;gap:10px;margin-top:12px">
              <div style="flex:1"><div style="font-size:11.5px;color:var(--muted)">Белки ${kc.protein}/${kc.goalP}</div>${mbar(kc.protein,kc.goalP)}</div>
              <div style="flex:1"><div style="font-size:11.5px;color:var(--muted)">Жиры ${kc.fat}/${kc.goalF}</div>${mbar(kc.fat,kc.goalF)}</div>
              <div style="flex:1"><div style="font-size:11.5px;color:var(--muted)">Углев. ${kc.carbs}/${kc.goalC}</div>${mbar(kc.carbs,kc.goalC)}</div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><b>💧 ${(w.ml/1000).toFixed(1)} / ${(w.goal/1000).toFixed(1)} л</b></div>${bar(w.goal?w.ml/w.goal*100:0)}</div>`;
        if (today) h += `<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="waterQuick(250).then(renderHealth)">＋ стакан</button><button class="btn" style="flex:1" onclick="waterQuick(500).then(renderHealth)">＋ 0.5 л</button><button class="btn primary" style="flex:1" onclick="openFoodAdd()">＋ еда</button></div>`;
        // Питание по приёмам
        h += `<div class="section-title">Питание</div>`;
        const MEALS = [["breakfast", "🌅 Завтрак"], ["lunch", "☀️ Обед"], ["dinner", "🌙 Ужин"], ["snack", "🍎 Перекус"], ["", "🍽 Другое"]];
        const byMeal = {};
        d.entries.forEach((e) => { const m = e.meal || ""; (byMeal[m] = byMeal[m] || []).push(e); });
        const foodRow = (e) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 2px"><div style="min-width:0"><div>${esc(e.title)}</div><div style="font-size:12px;color:var(--muted)">${e.kcal} ккал · Б${e.protein} Ж${e.fat} У${e.carbs}</div></div><button class="btn ghost" onclick="delFood(${e.id})">✕</button></div>`;
        let anyMeal = false;
        MEALS.forEach(([key, label]) => {
          const items = byMeal[key]; if (!items || !items.length) return;
          anyMeal = true;
          const sub = items.reduce((s, e) => s + e.kcal, 0);
          h += `<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 2px 4px"><b style="font-size:13px">${label}</b><span style="color:var(--muted);font-size:12px">${sub} ккал</span></div><div class="card">${items.map(foodRow).join("")}</div>`;
        });
        if (!anyMeal) h += `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Ничего не записано. Скажи Саре «съел…» или жми «＋ еда».</div></div>`;
        // Тренировки / активность
        const act = d.activity || { entries: [], burned: 0 };
        h += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center"><span>Мои тренировки</span><span onclick="openWorkouts()" style="color:var(--muted);font-size:12px;font-weight:600;cursor:pointer">Все →</span></div><div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center"><div><b>🔥 −${act.burned} ккал</b> <span style="color:var(--muted);font-size:12px">сегодня · баланс ${d.balance >= 0 ? "+" : ""}${d.balance}</span></div>${today ? `<button class="btn sm" onclick="openActivity()">＋ тренировка</button>` : ""}</div>
            ${act.entries.length ? act.entries.map((a) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px"><span style="min-width:0">🏋️ ${esc(a.title)}</span><span style="color:var(--muted)">−${a.kcal}${today ? ` <button class="btn ghost" onclick="delActivity(${a.id})">✕</button>` : ""}</span></div>`).join("") : `<div style="color:var(--muted);padding:6px 2px;font-size:12px">Сегодня тренировок нет. Скажи «пробежка 30 минут» или добавь кнопкой.</div>`}
          </div>`;
        // Самочувствие
        const wb = d.wellbeing || {};
        h += `<div class="section-title">Самочувствие</div><div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center"><span>😴 Сон: ${wb.sleep != null ? wb.sleep + " ч" : "—"}</span>${today ? `<button class="btn sm" onclick="logSleep()">Указать</button>` : ""}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span>Настроение: ${wb.mood ? esc(wb.mood) : "—"}</span>${today ? `<div style="display:flex;gap:8px">${["😞","😐","🙂","😃"].map((e) => `<span onclick="setMood('${e}')" style="font-size:22px;cursor:pointer">${e}</span>`).join("")}</div>` : ""}</div>
          </div>`;
        // Сводка за неделю
        const wkS = d.week;
        if (wkS) {
          const cell = (v, l) => `<div style="flex:1;text-align:center;padding:8px 2px"><div style="font-size:18px;font-weight:800">${v}</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${l}</div></div>`;
          const wd = wkS.weightDelta;
          h += `<div class="section-title">За неделю (среднее)</div><div class="card" style="display:flex;padding:6px">
            ${cell(wkS.avgKcal, "ккал/день")}
            <div style="border-left:1px solid var(--border)"></div>${cell((wkS.avgWater/1000).toFixed(1) + " л", "вода/день")}
            <div style="border-left:1px solid var(--border)"></div>${cell(wd == null ? "—" : (wd > 0 ? "+" : "") + wd + " кг", "вес")}</div>`;
        }
        // Рекомендация и меню ИИ (только сегодня)
        if (today) h += `<div id="advice-box"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="getAdvice()">✨ Рекомендация</button><button class="btn" style="flex:1" onclick="getMenu()">🍱 Меню на день</button></div>
          <button class="btn" style="width:100%;margin-top:8px" onclick="openFoodSummary()">📤 Сводка тренеру</button>`;
        // БАДы / фарма
        h += `<div class="section-title">Приём добавок</div><button class="btn" style="width:100%" onclick="openSupplements()">💊 БАДы и фарма — курсы и напоминания</button>`;
        // Вес + график
        const wk = d.weight || { latest: null, history: [] };
        const wvals = (wk.history || []).map((x) => x.kg).reverse();
        const spark = (() => {
          if (wvals.length < 2) return "";
          const W = 280, H = 40, mn = Math.min(...wvals), mx = Math.max(...wvals), rng = mx - mn || 1;
          const pts = wvals.map((v, i) => `${(i / (wvals.length - 1) * W).toFixed(1)},${(H - (v - mn) / rng * (H - 6) - 3).toFixed(1)}`).join(" ");
          return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="40" preserveAspectRatio="none" style="margin-top:8px"><polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
        })();
        h += `<div class="section-title">Вес</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:20px">${wk.latest != null ? wk.latest + " кг" : "—"}</b>${wk.history && wk.history.length > 1 ? `<span style="color:var(--muted);font-size:12px"> (было ${wk.history[1].kg})</span>` : ""}</div><button class="btn sm" onclick="logWeight()">Записать</button></div>${spark}</div>`;
        // Заметки
        h += `<div class="section-title">Заметки о самочувствии</div>`;
        h += (d.notes && d.notes.length)

    const T_MORE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';

      if (t.status !== "failed") rows.push(`<button class="btn" style="width:100%" onclick="closeSheet();setTask(${id},'failed')">Не сделано</button>`);
      if (t.status !== "done") rows.push(`<button class="btn" style="width:100%" onclick="closeSheet();editTask(${id})">Изменить</button>`);
      rows.push(`<button class="btn" style="width:100%;color:#e5484d" onclick="closeSheet();delTask(${id})">Удалить</button>`);
      openSheet(`<h3>${esc(t.title)}</h3><div style="display:flex;flex-direction:column;gap:8px">${rows.join("")}</div>`);
    };
    const WEEKDAY_RU = ["", "понедельник", "вторник", "среду", "четверг", "пятницу", "субботу", "воскресенье"];
    /** Человеческая подпись правила повтора: «каждый вторник», «по будням». */
    function repeatRu(rule) {
      if (rule === "daily") return "каждый день";
      if (rule === "weekdays") return "по будням";
      if (rule === "weekly") return "каждую неделю";
      if (rule === "monthly") return "каждый месяц";
      const m = /^w:([1-7])$/.exec(rule || "");
      if (!m) return "";
      return (m[1] === "3" ? "каждую " : "каждый ") + WEEKDAY_RU[+m[1]];
    }

    function taskCard(t) {
      const due = fmtDue(t.due_at);
      const done = t.status === "done", closed = done || t.status === "failed";
      const doneTxt = t.done_at ? new Date(t.done_at).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) : "";
      let dueStyle = "";
      if (!closed && t.due_at) {
        const ms = new Date(t.due_at).getTime() - Date.now();
        const c = ms < 3600000 ? ["rgba(229,72,77,.18)", "#ff6b6b"] : ms < 86400000 ? ["rgba(240,171,0,.18)", "#f2b705"] : ["rgba(48,164,108,.18)", "#43c883"];
        dueStyle = `background:${c[0]};color:${c[1]};border-color:transparent;font-weight:700`;
      }
      return `<div class="card item ${done?'done':''}">
        <div class="top"><div class="name ${done?'done':''}">${esc(t.title)}</div>${t.client && !closed ? `<span class="pill" style="background:var(--fg);color:var(--fg-contrast);border-color:transparent;font-weight:700;flex:none">📁 ${esc(t.client)}</span>` : ""}</div>
        ${t.description && !closed ? `<div style="color:var(--muted);font-size:12.5px;line-height:1.4;margin:2px 0 6px;white-space:pre-wrap">${esc(t.description)}</div>` : ""}
        <div class="meta">
          ${done && doneTxt ? `<span class="pill">выполнено ${doneTxt}</span>` : (due.txt ? `<span class="pill" style="${dueStyle}">⏱ ${due.txt}</span>` : "")}
          ${!closed && t.priority ? `<span class="pill strong">важно</span>` : ""}
          ${t.repeat_rule ? `<span class="pill">🔁 ${esc(repeatRu(t.repeat_rule))}</span>` : ""}
          ${closed && t.client ? `<span class="pill">📁 ${esc(t.client)}</span>` : ""}
        </div>
        <div class="actions">${taskActions(t)}</div></div>`;
    }
    async function renderTasks(warm = tabHtml.tasks !== undefined) {
      const mine = tab;
      if (!warm) view.innerHTML =
        `<div class="seg"><div class="${taskScope==='work'?'on':''}" onclick="setScope('work')">Рабочие</div><div class="${taskScope==='personal'?'on':''}" onclick="setScope('personal')">Личные</div></div>
         <div class="chips" id="task-stages"></div><div id="tasklist">${skeleton("list")}</div>`;
      try {
        const { tasks } = await api(`/tasks?scope=${taskScope}&status=all`);
        if (tab !== mine) return;
        tasksCache = tasks;
        const groups = { open: [], in_progress: [], done: [], failed: [] };
        tasks.forEach((t) => { (groups[t.status] || (groups[t.status] = [])).push(t); });
        setHTML("task-stages", TASK_STAGES.map(([k, l]) => `<div class="chip ${taskStage===k?'on':''}" onclick="setStage('${k}')">${l} · ${(groups[k]||[]).length}</div>`).join(""));
        const list = groups[taskStage] || [];
        const el = $("tasklist"); if (!el) return;
        el.innerHTML = list.length ? list.map(taskCard).join("") : emptyBox("Пусто", "Нет задач в этом статусе.");
      } catch (e) { setHTML("tasklist", err(e)); }
    }

    let calView = "list";       // list | month
    let calMonthOffset = 0;     // 0 = текущий месяц
    let calItems = [];          // объединённые встречи + задачи
    let calSelDay = null;       // выбранный день (YYYY-MM-DD) в режиме месяца
    const dayKey = (d) => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
    const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

    async function renderCalendar(warm = tabHtml.calendar !== undefined) {
      const tmBanner = me.telemost === false
        ? `<div class="card" style="margin-bottom:12px"><div style="font-weight:700;margin-bottom:4px">🎥 Телемост не подключён</div><div style="color:var(--muted);font-size:13px;margin-bottom:10px">Подключи — и Сара будет добавлять ссылку на видеовстречу в события.</div><button class="btn primary" onclick="telemostConnect()">Подключить Телемост</button></div>`
        : "";
      const mine = tab;
      if (!warm) view.innerHTML =
        tmBanner +
        `<div class="seg"><div class="${calView==='list'?'on':''}" onclick="calSetView('list')">Список</div><div class="${calView==='month'?'on':''}" onclick="calSetView('month')">Месяц</div></div>
         <div id="calbody">${skeleton("list")}</div>`;
      try {
        const [ev, tk] = await Promise.all([api("/events"), api("/tasks?status=active")]);
        eventsCache = ev.events;
        calItems = [
          ...ev.events.map((e) => ({ kind: "event", id: e.id, title: e.title, at: e.starts_at, location: e.location, client: e.client })),
          ...tk.tasks.filter((t) => t.due_at).map((t) => ({ kind: "task", id: t.id, title: t.title, at: t.due_at, scope: t.scope })),
        ].sort((a, b) => new Date(a.at) - new Date(b.at));
        calView === "month" ? calRenderMonth() : calRenderList();
      } catch (e) { setHTML("calbody", err(e)); }
    }
    window.telemostConnect = async () => {
      haptic();
      let url;
      try { url = (await api("/telemost/auth-url")).url; } catch (e) { return tg.showAlert("Не удалось начать: " + (e.message || e) + "\n(нужны TELEMOST_CLIENT_ID/SECRET в Cloudflare)"); }
      try { tg.openLink ? tg.openLink(url) : window.open(url, "_blank"); } catch (e) { window.open(url, "_blank"); }
      openSheet(`<h3>Подключение Телемоста</h3>
        <div class="field"><label>Вошёл Яндексом в открывшемся окне? Вставь код, который показал Яндекс</label><input id="tm-code" placeholder="Код подтверждения" autocomplete="off"></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="telemostFinish()">Подключить</button></div>`);
    };
    window.telemostFinish = async () => {
      const code = ($("tm-code").value || "").trim(); if (!code) return tg.showAlert("Вставь код с экрана Яндекса");
      try { await api("/telemost/connect", { method: "POST", body: JSON.stringify({ code }) }); }
      catch (e) { return tg.showAlert("Не подключилось: " + (e.message || e)); }
      me.telemost = true; closeSheet(); tg.showAlert("✅ Телемост подключён"); renderCalendar();
    };
    window.calSetView = (v) => { calView = v; calSelDay = null; renderCalendar(); };
    window.calPrev = () => { calMonthOffset--; calSelDay = null; calRenderMonth(); };
    window.calNext = () => { calMonthOffset++; calSelDay = null; calRenderMonth(); };

    function calItemRow(it) {
      const t = new Date(it.at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const over = it.kind === "task" && new Date(it.at) < new Date();
      const tag = it.kind === "event" ? "встреча" : (it.scope === "personal" ? "личная" : "рабочая");
      const edit = it.kind === "event" ? `editEvent(${it.id})` : `editTask(${it.id})`;
      const del = it.kind === "event" ? `delEvent(${it.id})` : `delTask(${it.id})`;
      return `<div class="card item"><div class="top"><div class="name">${it.kind === "event" ? "📅 " : "✅ "}${esc(it.title)}</div>${it.client ? `<span class="pill" style="background:var(--fg);color:var(--fg-contrast);border-color:transparent;font-weight:700;flex:none">📁 ${esc(it.client)}</span>` : ""}</div>
        <div class="meta"><span class="pill ${over?'strong':''}">${t}</span><span class="pill">${tag}</span></div>
        <div class="actions"><button class="btn" onclick="${edit}">Изменить</button><button class="btn ghost" onclick="${del}">✕</button></div></div>`;
    }

    function calRenderList() {
      const el = $("calbody");
      if (!el) return;
      if (!calItems.length) { el.innerHTML = emptyBox("Пусто", "Нет встреч и задач со сроком. Добавь кнопкой «+»."); return; }
      const groups = {};
      calItems.forEach((it) => { const k = dayKey(new Date(it.at)); (groups[k] = groups[k] || []).push(it); });
      const today = dayKey(new Date()); const tmr = dayKey(new Date(Date.now() + 86400000));
      let h = "";
      Object.keys(groups).sort().forEach((k) => {
        const d = new Date(k + "T00:00");
        const label = k === today ? "Сегодня" : k === tmr ? "Завтра" : d.toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "long" });
        h += `<div class="section-title">${label}</div>` + groups[k].map(calItemRow).join("");
      });
      el.innerHTML = h;
    }

    function calRenderMonth() {
      const el = $("calbody"); if (!el) return;
      const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      const counts = {};
      calItems.forEach((it) => { const k = dayKey(new Date(it.at)); counts[k] = (counts[k] || 0) + 1; });
      const first = new Date(year, month, 1);
      let lead = (first.getDay() + 6) % 7; // Пн=0
      const days = new Date(year, month + 1, 0).getDate();
      const today = dayKey(new Date());
      let cells = "";
      for (let i = 0; i < lead; i++) cells += `<div></div>`;
      for (let d = 1; d <= days; d++) {
        const k = `${year}-${p2(month+1)}-${p2(d)}`;
        const has = counts[k] || 0;
        const isToday = k === today, sel = k === calSelDay;
        cells += `<div onclick="calSelectDay('${k}')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;
          ${sel ? 'background:var(--fg);color:var(--fg-contrast);' : isToday ? 'border:1px solid var(--border-strong);' : ''}">
          ${d}<span style="height:5px;width:5px;border-radius:50%;margin-top:3px;background:${has ? (sel ? 'var(--fg-contrast)' : 'var(--fg)') : 'transparent'}"></span></div>`;
      }
      let h = `<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px">
          <button class="icon-btn" onclick="calPrev()">‹</button>
          <div style="font-weight:800;letter-spacing:-.02em">${MONTHS[month]} ${year}</div>
          <button class="icon-btn" onclick="calNext()">›</button></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:6px">${WD.map((w)=>`<div>${w}</div>`).join("")}</div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
        <div id="calday" style="margin-top:14px"></div>`;
      el.innerHTML = h;
      if (calSelDay) calRenderDay();
    }
    window.calSelectDay = (k) => { calSelDay = calSelDay === k ? null : k; calRenderMonth(); };
    function calRenderDay() {
      const box = $("calday"); if (!box) return;
      const items = calItems.filter((it) => dayKey(new Date(it.at)) === calSelDay);
      const d = new Date(calSelDay + "T00:00");
      const label = d.toLocaleDateString("ru-RU", { weekday: "long", day: "2-digit", month: "long" });
      box.innerHTML = `<div class="section-title">${label}</div>` + (items.length ? items.map(calItemRow).join("") : `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Ничего не запланировано</div></div>`);
    }

    window.openContacts = async () => {
      openSheet(`<h3>Контакты и дни рождения</h3><button class="btn primary" style="width:100%;margin-bottom:10px" onclick="openAddContact()">＋ добавить контакт</button><div id="clist"><div class="loading">Загрузка…</div></div>`);
      try {
        const { contacts } = await api("/contacts");
        contactsCache = contacts;
        setHTML("clist", contacts.length ? contacts.map((c) => {
          const tags = (c.tags || "").split(",").map((s) => s.trim()).filter(Boolean);
          return `<div class="card item">
            <div class="top"><div class="name">${esc(c.name)}</div></div>
            <div class="meta">${c.birthday?`<span class="pill strong">🎂 ${esc(fmtBd(c.birthday))}</span>`:""}${c.phone?`<span class="pill">${esc(c.phone)}</span>`:""}${tags.map((t)=>`<span class="pill">#${esc(t)}</span>`).join("")}</div>
            <div class="actions"><button class="btn" onclick="editContact(${c.id})">Изменить</button><button class="btn ghost" onclick="delContact(${c.id})">✕</button></div>
          </div>`; }).join("") : `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Пока пусто. Добавь контакт с ДР — напомню заранее.</div></div>`);
      } catch (e) { setHTML("clist", err(e)); }
    };
    function afterContactChange() { openContacts(); if (tab === "home") renderHome(); }

    async function renderClients(warm = tabHtml.clients !== undefined) {
      const mine = tab;
      if (!warm) view.innerHTML = '<div class="section-title">Клиенты и проекты</div><div id="cllist">' + skeleton("list") + '</div>';
      const PLAT = { direct: "Директ", google: "Google Ads", tg: "TG Ads", vk: "VK", avito: "Авито", site: "Сайт" };

        el.innerHTML = clients.map((c) => {
          const plats = (c.platforms || "").split(",").filter(Boolean).map((p) => PLAT[p] || p).join(", ");
          return `<div class="card item"><div class="top" onclick="openClientCard(${c.id})" style="cursor:pointer"><div class="name">${c.status === "active" ? "● " : "○ "}${esc(c.name)}</div><span style="color:var(--muted)">›</span></div>
            <div class="meta"><span class="pill">${plats || "—"}</span>${c.budget ? `<span class="pill">бюджет ${money(c.budget)}</span>` : ""}${c.pay_amount ? `<span class="pill strong">ведение ${money(c.pay_amount)}</span>` : ""}${c.pay_due ? `<span class="pill">оплата ${esc(c.pay_due)}</span>` : ""}${c.status !== "active" ? `<span class="pill">на паузе</span>` : ""}</div>
            <div class="actions">
              ${c.metrika_counter ? `<button class="btn primary" onclick="openReport(${c.id})">📊 Отчёт</button>` : ""}
              <button class="btn" onclick="editClient(${c.id})">Изменить</button>
              <button class="btn" onclick="toggleClient(${c.id},'${c.status === "active" ? "paused" : "active"}')">${c.status === "active" ? "Пауза" : "Вернуть"}</button>
              <button class="btn ghost" onclick="delClient(${c.id})">✕</button>
            </div></div>`;
        }).join("");
      } catch (e) { setHTML("cllist", err(e)); }
    }

    /* ---------- Отчёты Метрики ---------- */
    let reportClient = null, reportDays = 30;
    window.openReport = (id) => { reportClient = id; reportDays = 30; loadReport(); };
    window.setReportDays = (n) => { reportDays = n; loadReport(); };
    async function loadReport() {
      openSheet(`<h3>Отчёт Метрики</h3>
        <div class="seg mini"><div class="${reportDays===7?'on':''}" onclick="setReportDays(7)">7 дней</div><div class="${reportDays===30?'on':''}" onclick="setReportDays(30)">30 дней</div><div class="${reportDays===90?'on':''}" onclick="setReportDays(90)">90 дней</div></div>
        <div id="rep-body"><div class="loading">Загрузка…</div></div>`);
      try {
        const d = await api(`/reports/metrika?client=${reportClient}&days=${reportDays}`);
        const r = d.report;
        const kpi = (v, l) => `<div style="flex:1;text-align:center;padding:12px 4px"><div style="font-size:22px;font-weight:800;letter-spacing:-.03em">${v}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${l}</div></div>`;
        const dur = `${Math.floor(r.avgDuration/60)}:${String(r.avgDuration%60).padStart(2,'0')}`;
        let h = `<div style="color:var(--muted);font-size:12.5px;margin-bottom:10px">${esc(d.client)} · ${d.date1} — ${d.date2}</div>`;
        h += `<div class="card" style="display:flex;padding:4px;margin-bottom:8px">${kpi(r.visits,'визиты')}${kpi(r.users,'посетители')}</div>`;
        h += `<div class="card" style="display:flex;padding:4px">${kpi(r.bounceRate+'%','отказы')}${kpi(dur,'на сайте')}${kpi(r.pageviews,'просмотры')}</div>`;
        if (r.sources && r.sources.length) h += `<div class="section-title">Источники трафика</div><div class="card">${r.sources.map(s=>`<div style="display:flex;justify-content:space-between;padding:7px 2px"><span>${esc(s.name)}</span><b>${s.visits}</b></div>`).join("")}</div>`;
        h += `<div style="color:var(--muted);font-size:12px;margin-top:12px">📄 Выгрузка в Word: напиши боту <b>/report ${esc(d.client)}</b></div>`;
        setHTML("rep-body", h);
      } catch (e) {
        const m = e.message || e;
        const needConnect = m === "yandex_not_connected" || /403|token|scope|доступ|forbidden|unauthorized|not connected|подключ/i.test(String(m));
        const msg = m === "no_counter" ? "У клиента не указан счётчик Метрики — добавь его в карточке («Изменить»)."
          : needConnect ? "Нет доступа к Метрике. Обнови вход в Яндекс (нужно право metrika:read)."
          : "Ошибка: " + esc(m);
        setHTML("rep-body", `<div class="card"><div style="color:var(--muted);padding:8px 8px 12px;text-align:center">${msg}</div>${needConnect ? `<button class="btn primary" style="width:100%" onclick="telemostConnect()">🔗 Подключить / обновить Яндекс</button>` : ""}</div>`);
      }
    }

    /* ---------- Уведомления ---------- */
    /* ---------- Кто такая Сара ---------- */
    // Готовые лица нарисованы прямо здесь: не зависят от чужих серверов,
    // грузятся мгновенно и одинаково выглядят в светлой и тёмной теме.
    const FACES = [
