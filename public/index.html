<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sara</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Светлая тема (по умолчанию) — премиальный монохром */
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f5f5f6;
      --text: #0a0a0a;
      --muted: #86868b;
      --border: rgba(0,0,0,.09);
      --border-strong: rgba(0,0,0,.16);
      --fg: #0a0a0a;            /* «акцент» = контрастный передний план */
      --fg-contrast: #ffffff;   /* текст на --fg */
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --radius: 18px;
      --radius-sm: 12px;
      --nav-h: 62px;
    }
    :root[data-theme="dark"] {
      --bg: #0a0a0b;
      --surface: #151517;
      --surface-2: rgba(255,255,255,.055);
      --text: #f6f6f7;
      --muted: #9a9aa1;
      --border: rgba(255,255,255,.10);
      --border-strong: rgba(255,255,255,.20);
      --fg: #f6f6f7;
      --fg-contrast: #0a0a0b;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.5);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body { min-height: 100%; }
    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.5; letter-spacing: -.01em;
      padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
      overflow-x: hidden; transition: background .25s ease, color .25s ease;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 18px; }
    button, input, select, textarea { font-family: inherit; }

    /* Header */
    header { padding: 20px 18px 6px; }
    .hrow { display: flex; align-items: center; gap: 13px; max-width: 640px; margin: 0 auto; }
    .avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none;
      border: 1px solid var(--border); background: var(--surface-2); }
    .hello { flex: 1; min-width: 0; }
    .hello .h1 { font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
    .hello .sub { color: var(--muted); font-size: 13px; margin-top: 1px; font-weight: 500; }
    .icon-btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: var(--shadow-sm); transition: transform .12s ease, background .2s ease; }
    .icon-btn:active { transform: scale(.92); }
    .icon-btn svg { width: 19px; height: 19px; }

    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
      letter-spacing: .13em; margin: 22px 4px 11px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 11px; box-shadow: var(--shadow); }

    /* Home tiles */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .tile { border-radius: var(--radius); padding: 16px; cursor: pointer; border: 1px solid var(--border);
      background: var(--surface); box-shadow: var(--shadow); transition: transform .12s ease; }
    .tile:active { transform: scale(.98); }
    .tile.accent { background: var(--fg); border-color: var(--fg); }
    .tile.accent .n, .tile.accent .l { color: var(--fg-contrast); }
    .tile .n { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }
    .tile .l { font-size: 12.5px; color: var(--muted); margin-top: 8px; font-weight: 600; }

    /* CTA */
    .cta { display: flex; align-items: center; gap: 13px; cursor: pointer; background: var(--fg); border: 0;
      border-radius: var(--radius); padding: 16px 18px; margin: 11px 0; box-shadow: var(--shadow); transition: transform .12s ease; }
    .cta:active { transform: scale(.985); }
    .cta .ci { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--fg-contrast) 14%, transparent); }
    .cta .ci svg { width: 20px; height: 20px; color: var(--fg-contrast); }
    .cta .tx { color: var(--fg-contrast); font-weight: 700; font-size: 15.5px; letter-spacing: -.02em; }
    .cta .sm { color: color-mix(in srgb, var(--fg-contrast) 70%, transparent); font-size: 12.5px; font-weight: 500; margin-top: 1px; }
    .cta .arw { margin-left: auto; color: var(--fg-contrast); opacity: .7; }

    /* Agenda */
    .agenda-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .agenda-item:first-child { padding-top: 2px; } .agenda-item:last-child { border-bottom: 0; padding-bottom: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--muted); }
    .dot.strong { background: var(--fg); }
    .agenda-item .t { flex: 1; min-width: 0; }
    .agenda-item .t .ttl { font-weight: 600; }
    .agenda-item .t .m { font-size: 12.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }

    /* Segmented + chips */
    .seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 4px; gap: 4px; margin: 2px 0 14px; }
    .seg div { flex: 1; text-align: center; padding: 9px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer; transition: all .18s ease; }
    .seg div.on { color: var(--fg-contrast); background: var(--fg); box-shadow: var(--shadow-sm); }
    .chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .chip { padding: 7px 14px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s ease; }
    .chip.on { color: var(--fg-contrast); background: var(--fg); border-color: var(--fg); }

    /* Task / list cards */
    .item { position: relative; }
    .item .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .item .name { font-weight: 700; flex: 1; letter-spacing: -.02em; }
    .item .name.done { text-decoration: line-through; color: var(--muted); }
    .item.done { opacity: .55; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .pill { font-size: 11.5px; padding: 4px 10px; border-radius: 9px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); font-weight: 600; }
    .pill.strong { color: var(--fg-contrast); background: var(--fg); border-color: var(--fg); }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); transition: transform .1s ease; }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--fg); color: var(--fg-contrast); border-color: var(--fg); }
    .btn.ghost { flex: 0 0 44px; color: var(--muted); }
    .btn.sm { flex: 0 0 auto; padding: 9px 16px; }

    .empty { text-align: center; padding: 54px 20px; color: var(--muted); }
    .empty img { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; margin-bottom: 16px; border: 1px solid var(--border); filter: grayscale(.15); }
    .empty .big { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; letter-spacing: -.02em; }
    .loading { text-align: center; padding: 48px; color: var(--muted); font-weight: 500; }

    /* FAB */
    .fab { position: fixed; right: calc(50% - 300px); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
      width: 54px; height: 54px; border-radius: 50%; background: var(--fg); color: var(--fg-contrast); border: none; cursor: pointer;
      box-shadow: var(--shadow); z-index: 40; display: none; align-items: center; justify-content: center; transition: transform .12s ease; }
    .fab:active { transform: scale(.9); }
    .fab svg { width: 24px; height: 24px; }
    @media (max-width: 676px) { .fab { right: 20px; } }

    /* Bottom nav */
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border); padding: 8px 6px calc(6px + env(safe-area-inset-bottom)); }
    .nav-inner { max-width: 640px; margin: 0 auto; display: flex; }
    .nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; padding: 2px; transition: color .15s ease; letter-spacing: -.01em; }
    .nav a svg { width: 22px; height: 22px; }
    .nav a.on { color: var(--text); }

    /* Sheets */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(2px); display: none; align-items: flex-end; z-index: 60; opacity: 0; transition: opacity .2s ease; }
    .sheet-bg.show { display: flex; opacity: 1; }
    .sheet { background: var(--bg); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 24px 24px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.3); transform: translateY(12px); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
    .sheet-bg.show .sheet { transform: translateY(0); }
    .grabber { width: 38px; height: 4px; border-radius: 3px; background: var(--border-strong); margin: 4px auto 16px; }
    .sheet h3 { margin-bottom: 16px; font-size: 18px; font-weight: 800; letter-spacing: -.03em; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; letter-spacing: -.01em; }
    .field input, .field select, .field textarea { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 15px; outline: none; transition: border-color .15s ease; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--border-strong); }
    .field select option { color: #111; background: #fff; }  /* читаемо в нативном меню при любой теме */
    .field textarea { resize: vertical; min-height: 56px; }
    .check { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--fg); }
    .seg.mini div { padding: 9px; font-size: 13px; }

    /* AI chat */
    .ai-wrap { padding-bottom: 130px; min-height: 44vh; }
    .ai-head { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .msg { max-width: 85%; padding: 11px 14px; border-radius: 18px; margin: 9px 0; font-size: 14.5px; line-height: 1.5;
      white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.user { margin-left: auto; background: var(--fg); color: var(--fg-contrast); border-bottom-right-radius: 6px; }
    .msg.ai { margin-right: auto; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; box-shadow: var(--shadow-sm); }
    .msg.ai.think { color: var(--muted); font-style: italic; }
    .chatbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 2px + env(safe-area-inset-bottom)); z-index: 45; padding: 8px 14px 10px;
      background: linear-gradient(to top, var(--bg) 62%, transparent); }
    .chatbar-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 5px 5px 5px 18px; box-shadow: var(--shadow); }
    .chatbar input { flex: 1; border: 0; background: transparent; color: var(--text); font-size: 15px; outline: none; padding: 10px 0; }
    .chatbar button { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--fg); color: var(--fg-contrast); display: flex; align-items: center; justify-content: center; transition: transform .1s ease; }
    .chatbar button:active { transform: scale(.9); } .chatbar button:disabled { opacity: .4; }
    .chatbar button svg { width: 18px; height: 18px; }

    .link { color: var(--text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <img id="avatar" class="avatar" alt="Sara">
      <div class="hello">
        <div class="h1" id="greeting">Sara</div>
        <div class="sub" id="subtitle">Загрузка…</div>
      </div>
      <button class="icon-btn" id="notif-btn" aria-label="Уведомления" onclick="openNotif()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      <button class="icon-btn" id="admin-btn" aria-label="Доступы" style="display:none" onclick="openAdmin()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3 2.9-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><path d="M17 8v6M14 11h6"/></svg></button>
      <button class="icon-btn" id="theme-btn" aria-label="Тема"></button>
    </div>
  </header>

  <main class="wrap" id="view"><div class="loading">Загрузка…</div></main>

  <button class="fab" id="fab" aria-label="Добавить">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="nav"><div class="nav-inner" id="nav">
    <a data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg>Главная</a>
    <a data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Задачи</a>
    <a data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>Календарь</a>
    <a data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"/></svg>Здоровье</a>
    <a data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3 2.9-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><path d="M16 5.2a3 3 0 0 1 0 5.6M17.5 20c-.3-1.7-1-3-2-3.9"/></svg>Клиенты</a>
    <a data-tab="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3L12 3Z"/><path d="M18.5 14.5l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"/></svg>Sara</a>
  </div></nav>

  <div class="sheet-bg" id="sheet"><div class="sheet" id="sheet-body"></div></div>

  <script>
    // Приложение открывается и в Telegram, и по ссылке из MAX (там объекта Telegram нет) —
    // подставляем заглушку с теми же методами, чтобы код ниже не расходился на две ветки.
    const tg = (window.Telegram && window.Telegram.WebApp) || {
      ready() {}, expand() {}, initData: "", initDataUnsafe: {},
      setHeaderColor() {}, setBackgroundColor() {}, HapticFeedback: { impactOccurred() {} },
    };
    tg.ready(); tg.expand();
    // На мобильном Telegram перехватывает вертикальный свайп и мешает вводу в поля — отключаем
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    const INIT = tg.initData || "";
    // Токен сессии из MAX: приходит в ссылке (?max=…) и запоминается на устройстве
    const MAX_KEY = "sara-max-session";
    const MAX_SESSION = (() => {
      try {
        // 1) токен в ссылке из чата, 2) стартовый параметр мини-приложения MAX,
        // 3) сохранённый с прошлого входа
        const q = new URLSearchParams(location.search);
        let t = q.get("max") || q.get("startapp") || "";
        if (!t) {
          const bridges = [window.WebApp, window.MAX, window.maxWebApp];
          for (const b of bridges) {
            const p = b && (b.initDataUnsafe?.start_param || b.startParam);
            if (p) { t = String(p); break; }
          }
        }
        if (t) {
          localStorage.setItem(MAX_KEY, t);
          history.replaceState(null, "", location.pathname); // прячем токен из адресной строки
          return t;
        }
        return localStorage.getItem(MAX_KEY) || "";
      } catch (e) {
        return "";
      }
    })();
    const AUTH_HEADERS = { "X-Telegram-Init-Data": INIT, ...(MAX_SESSION ? { "X-Max-Session": MAX_SESSION } : {}) };
    const SARA = "https://d8j0ntlcm91z4.cloudfront.net/user_3FDW4xDpfIw798Hq1MYcfG8Ze1n/hf_20260727_104316_1c7a9ff3-3430-4ede-aff4-062cc444784f_min.webp";

    const $ = (id) => document.getElementById(id);
    const view = $("view");
    const setHTML = (id, html) => { const el = $(id); if (el) el.innerHTML = html; };
    // Надёжное подтверждение (в Telegram window.confirm часто не работает)
    const ask = (msg) => new Promise((res) => { try { if (tg.showConfirm) { tg.showConfirm(msg, (ok) => res(!!ok)); return; } } catch (e) {} res(typeof confirm === "function" ? confirm(msg) : true); });
    const esc = (s) => (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const haptic = (t = "light") => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
    $("avatar").src = SARA;

    /* ---------- Тема ---------- */
    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>';
    const THEME_KEY = "sara-theme";
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      $("theme-btn").innerHTML = t === "dark" ? SUN : MOON;
      const bg = t === "dark" ? "#0a0a0b" : "#ffffff";
      try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
      localStorage.setItem(THEME_KEY, t);
    }
    let theme = localStorage.getItem(THEME_KEY) || tg.colorScheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(theme);
    $("theme-btn").onclick = () => { haptic(); theme = theme === "dark" ? "light" : "dark"; applyTheme(theme); };

    /* ---------- Состояние ---------- */
    let tab = "home";
    let taskScope = "work";
    let taskStage = "open";
    let clientsCache = [];
    let tasksCache = [];
    let eventsCache = [];
    let contactsCache = [];
    let supCache = [];
    let me = {};
    let sheetOpen = false;
    const navStack = ["home"];

    /* ---------- API ---------- */
    async function api(path, opts = {}) {
      const res = await fetch("/api" + path, {
        ...opts,
        headers: { "Content-Type": "application/json", ...AUTH_HEADERS, ...(opts.headers || {}) },
      });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.status); }
      return res.json();
    }

    function fmtDue(iso) {
      if (!iso) return { over: false, txt: "" };
      const dd = new Date(iso), now = new Date();
      const days = Math.round((new Date(iso).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000);
      const t = dd.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const dm = dd.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
      if (dd < now) return { over: true, txt: "просрочено · " + dm };
      if (days === 0) return { over: false, txt: "сегодня " + t };
      if (days === 1) return { over: false, txt: "завтра " + t };
      return { over: false, txt: dm + " " + t };
    }
    function fmtEv(iso) { return new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
    const p2 = (n) => String(n).padStart(2, "0");
    function isoToLocalInput(iso) { const d = new Date(iso); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; }
    function isoToDueText(iso) { if (!iso) return ""; const d = new Date(iso); return `${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
    const MON_RU = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
    function money(v) {
      v = (v || "").trim();
      if (/^\d[\d\s]*$/.test(v)) return v.replace(/\s/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
      return esc(v);
    }
    function fmtBd(bd) { if (!bd) return ""; const p = bd.split("-"); const mo = p.length === 3 ? +p[1] : +p[0]; const d = p.length === 3 ? +p[2] : +p[1]; if (!mo || !d) return bd; return `${d} ${MON_RU[mo-1]}`; }
    function emptyBox(big, small) { return `<div class="empty"><img src="${SARA}" alt=""><div class="big">${big}</div><div>${small}</div></div>`; }
    function err(e) {
      const m = String(e.message || e);
      if (m === "no_access") return emptyBox("Нет доступа", "Получи доступ у владельца бота.");
      return `<div class="empty"><div class="big">Ошибка</div><div>${esc(m)}</div></div>`;
    }
    const ARROW = '<svg class="arw" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

    /* ---------- Экраны ---------- */
    async function renderHome() {

          });
          h += `</div>`;
        }
        // На сегодня — строго сегодняшнее (не просроченное)
        h += `<div class="section-title">На сегодня</div>`;
        if (!todayTasks.length && !d.events.length) {
          h += `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Всё спокойно. Свободный день ✦</div></div>`;
        } else {
          h += `<div class="card">`;
          todayTasks.forEach((t) => {
            const due = fmtDue(t.due_at);
            h += `<div class="agenda-item"><div class="dot"></div><div class="t"><div class="ttl">${esc(t.title)}</div><div class="m">${due.txt} · ${t.scope === "personal" ? "личное" : "работа"}</div></div></div>`;
          });
          d.events.forEach((e) => {
            h += `<div class="agenda-item"><div class="dot strong"></div><div class="t"><div class="ttl">${esc(e.title)}</div><div class="m">встреча · сегодня ${tOnly(e.starts_at)}${e.client ? " · 📁 " + esc(e.client) : ""}${e.location ? " · " + esc(e.location) : ""}</div></div></div>`;
          });
          h += `</div>`;
        }
        if (d.upcomingEvents && d.upcomingEvents.length) {
          h += `<div class="section-title">Ближайшие встречи</div><div class="card">`;
          d.upcomingEvents.forEach((e) => {

        h += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center"><span>Дни рождения</span><span onclick="openContacts()" style="color:var(--muted);font-size:12px;font-weight:600;cursor:pointer">Контакты →</span></div>`;
        if (d.birthdays.length) {
          h += `<div class="card">`;

            h += `<div class="agenda-item" onclick="openContacts()"><div class="dot"></div><div class="t"><div class="ttl">${esc(b.name)}</div><div class="m">${when} · ${fmtBd(b.date)}</div></div></div>`;

        renderHealthCard();
      } catch (e) { view.innerHTML = err(e); }
    }

    /* ---------- Здоровье: еда/калории + вода ---------- */
    async function renderHealthCard() {
      try {
        const d = await api("/health");
        if (tab !== "home") return;
        const el = $("health-card"); if (!el) return;
        const kc = d.kcal, w = d.water;
        const bar = (pct) => `<div style="height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:4px"><div style="height:100%;width:${Math.min(100, pct)}%;background:var(--fg)"></div></div>`;

        const wpct = w.goal ? Math.round(w.ml / w.goal * 100) : 0;
        el.innerHTML = `<div class="card" onclick="switchTab('health')">
            <div style="display:flex;justify-content:space-between;align-items:baseline"><b>🔥 ${kc.consumed} / ${kc.goal} ккал</b><span style="color:var(--muted);font-size:12px">Б ${kc.protein} · Ж ${kc.fat} · У ${kc.carbs}</span></div>

            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><b>💧 ${(w.ml/1000).toFixed(1)} / ${(w.goal/1000).toFixed(1)} л</b><span style="color:var(--muted);font-size:12px">${wpct}%</span></div>
            ${bar(wpct)}
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn" style="flex:1" onclick="waterQuick(250)">＋ стакан</button>
            <button class="btn" style="flex:1" onclick="waterQuick(500)">＋ 0.5 л</button>
            <button class="btn primary" style="flex:1" onclick="openFoodAdd()">＋ еда</button>
          </div>`;
      } catch (e) { const el = $("health-card"); if (el) el.innerHTML = ""; }
    }
    window.waterQuick = async (ml) => { haptic(); try { await api("/health/water", { method: "POST", body: JSON.stringify({ ml }) }); } catch (e) {} if (tab === "home") renderHealthCard(); };
    const mealDefault = () => { const hh = new Date().getHours(); return hh >= 5 && hh < 11 ? "breakfast" : hh >= 11 && hh < 16 ? "lunch" : hh >= 16 && hh < 22 ? "dinner" : "snack"; };
    let recentFoods = [];
    window.openFoodAdd = async () => {
      const md = mealDefault();
      const opt = (v, l) => `<option value="${v}" ${v === md ? "selected" : ""}>${l}</option>`;
      openSheet(`<h3>Что съели?</h3>
        <div class="field"><label>Опиши блюдо — калории и БЖУ оценит ИИ</label><input id="f-food" placeholder="напр. тарелка борща с хлебом" autocomplete="off"></div>
        <div class="field"><label>Приём пищи</label><select id="f-meal">${opt("breakfast","🌅 Завтрак")}${opt("lunch","☀️ Обед")}${opt("dinner","🌙 Ужин")}${opt("snack","🍎 Перекус")}</select></div>
        <div id="food-recent"></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" id="food-save" onclick="saveFood()">Добавить</button></div>`);
      setTimeout(() => { const i = $("f-food"); if (i) i.focus(); }, 150);
      try {
        const { recent } = await api("/health/recent");
        recentFoods = recent || [];
        const box = $("food-recent");
        if (box && recentFoods.length) box.innerHTML = `<label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Часто едите — тап, чтобы добавить</label><div class="chips">${recentFoods.map((r, i) => `<div class="chip" onclick="quickFood(${i})">${esc(r.title)} · ${r.kcal}</div>`).join("")}</div>`;
      } catch (e) {}
    };
    window.quickFood = async (i) => {
      const r = recentFoods[i]; if (!r) return;
      const meal = $("f-meal") ? $("f-meal").value : r.meal;
      try { await api("/health/food", { method: "POST", body: JSON.stringify({ title: r.title, kcal: r.kcal, protein: r.protein, fat: r.fat, carbs: r.carbs, meal }) }); }
      catch (e) { return tg.showAlert("Ошибка"); }
      closeSheet(); if (tab === "health") renderHealth(); if (tab === "home") renderHealthCard();
    };
    window.saveFood = async () => {
      const title = ($("f-food").value || "").trim(); if (!title) return tg.showAlert("Опиши, что съел");
      const meal = $("f-meal") ? $("f-meal").value : undefined;
      const btn = $("food-save"); if (btn) { btn.disabled = true; btn.textContent = "Оцениваю…"; }

    /* ---------- Раздел «Здоровье» (отдельный экран) ---------- */
    let healthOffset = 0; // 0 — сегодня, -1 — вчера …

    async function renderHealth() {
      view.innerHTML = '<div class="loading">Загрузка…</div>';

        const d = await api(`/health?date=${healthDateStr(healthOffset)}`);

        const label = healthOffset === 0 ? "Сегодня" : healthOffset === -1 ? "Вчера" : (() => { const dt = new Date(); dt.setDate(dt.getDate()+healthOffset); return dt.toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "long" }); })();
        const bar = (pct) => `<div style="height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:5px"><div style="height:100%;width:${Math.min(100,pct)}%;background:var(--fg)"></div></div>`;
        const streakTxt = d.streak ? `🔥 ${d.streak} ${d.streak % 10 === 1 && d.streak % 100 !== 11 ? "день" : (d.streak % 10 >= 2 && d.streak % 10 <= 4 && (d.streak % 100 < 10 || d.streak % 100 >= 20) ? "дня" : "дней")} подряд` : "";
        let h = `<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 2px 4px">

        if (today && streakTxt) h += `<div style="text-align:center;margin-bottom:10px;color:var(--muted);font-size:13px">${streakTxt}</div>`;
        if (today) h += `<button class="btn" style="width:100%;margin-bottom:8px" onclick="openProfile()">👤 Мой профиль — для точных меню и советов</button>`;
        // КБЖУ
        const remain = kc.goal - kc.consumed;
        const mbar = (v, g) => bar(g ? v / g * 100 : 0);
        h += `<div class="card">
            <div style="display:flex;justify-content:space-between;align-items:baseline"><b>🔥 ${kc.consumed} / ${kc.goal} ккал</b><span style="color:var(--muted);font-size:12px">${remain >= 0 ? `осталось ${remain}` : `перебор ${-remain}`}</span></div>${bar(kc.goal?kc.consumed/kc.goal*100:0)}
            <div style="display:flex;gap:10px;margin-top:12px">

            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><b>💧 ${(w.ml/1000).toFixed(1)} / ${(w.goal/1000).toFixed(1)} л</b></div>${bar(w.goal?w.ml/w.goal*100:0)}</div>`;
        if (today) h += `<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="waterQuick(250).then(renderHealth)">＋ стакан</button><button class="btn" style="flex:1" onclick="waterQuick(500).then(renderHealth)">＋ 0.5 л</button><button class="btn primary" style="flex:1" onclick="openFoodAdd()">＋ еда</button></div>`;
        // Питание по приёмам
        h += `<div class="section-title">Питание</div>`;
        const MEALS = [["breakfast", "🌅 Завтрак"], ["lunch", "☀️ Обед"], ["dinner", "🌙 Ужин"], ["snack", "🍎 Перекус"], ["", "🍽 Другое"]];
        const byMeal = {};
        d.entries.forEach((e) => { const m = e.meal || ""; (byMeal[m] = byMeal[m] || []).push(e); });
        const foodRow = (e) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 2px"><div style="min-width:0"><div>${esc(e.title)}</div><div style="font-size:12px;color:var(--muted)">${e.kcal} ккал · Б${e.protein} Ж${e.fat} У${e.carbs}</div></div><button class="btn ghost" onclick="delFood(${e.id})">✕</button></div>`;
        let anyMeal = false;
        MEALS.forEach(([key, label]) => {
          const items = byMeal[key]; if (!items || !items.length) return;
          anyMeal = true;
          const sub = items.reduce((s, e) => s + e.kcal, 0);
          h += `<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 2px 4px"><b style="font-size:13px">${label}</b><span style="color:var(--muted);font-size:12px">${sub} ккал</span></div><div class="card">${items.map(foodRow).join("")}</div>`;
        });
        if (!anyMeal) h += `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Ничего не записано. Скажи Саре «съел…» или жми «＋ еда».</div></div>`;
        // Тренировки / активность
        const act = d.activity || { entries: [], burned: 0 };
        h += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center"><span>Мои тренировки</span><span onclick="openWorkouts()" style="color:var(--muted);font-size:12px;font-weight:600;cursor:pointer">Все →</span></div><div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center"><div><b>🔥 −${act.burned} ккал</b> <span style="color:var(--muted);font-size:12px">сегодня · баланс ${d.balance >= 0 ? "+" : ""}${d.balance}</span></div>${today ? `<button class="btn sm" onclick="openActivity()">＋ тренировка</button>` : ""}</div>
            ${act.entries.length ? act.entries.map((a) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px"><span style="min-width:0">🏋️ ${esc(a.title)}</span><span style="color:var(--muted)">−${a.kcal}${today ? ` <button class="btn ghost" onclick="delActivity(${a.id})">✕</button>` : ""}</span></div>`).join("") : `<div style="color:var(--muted);padding:6px 2px;font-size:12px">Сегодня тренировок нет. Скажи «пробежка 30 минут» или добавь кнопкой.</div>`}
          </div>`;
        // Самочувствие
        const wb = d.wellbeing || {};
        h += `<div class="section-title">Самочувствие</div><div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center"><span>😴 Сон: ${wb.sleep != null ? wb.sleep + " ч" : "—"}</span>${today ? `<button class="btn sm" onclick="logSleep()">Указать</button>` : ""}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span>Настроение: ${wb.mood ? esc(wb.mood) : "—"}</span>${today ? `<div style="display:flex;gap:8px">${["😞","😐","🙂","😃"].map((e) => `<span onclick="setMood('${e}')" style="font-size:22px;cursor:pointer">${e}</span>`).join("")}</div>` : ""}</div>
          </div>`;
        // Сводка за неделю
        const wkS = d.week;
        if (wkS) {
          const cell = (v, l) => `<div style="flex:1;text-align:center;padding:8px 2px"><div style="font-size:18px;font-weight:800">${v}</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${l}</div></div>`;
          const wd = wkS.weightDelta;
          h += `<div class="section-title">За неделю (среднее)</div><div class="card" style="display:flex;padding:6px">
            ${cell(wkS.avgKcal, "ккал/день")}
            <div style="border-left:1px solid var(--border)"></div>${cell((wkS.avgWater/1000).toFixed(1) + " л", "вода/день")}
            <div style="border-left:1px solid var(--border)"></div>${cell(wd == null ? "—" : (wd > 0 ? "+" : "") + wd + " кг", "вес")}</div>`;
        }
        // Рекомендация и меню ИИ (только сегодня)
        if (today) h += `<div id="advice-box"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" onclick="getAdvice()">✨ Рекомендация</button><button class="btn" style="flex:1" onclick="getMenu()">🍱 Меню на день</button></div>
          <button class="btn" style="width:100%;margin-top:8px" onclick="openFoodSummary()">📤 Сводка тренеру</button>`;
        // БАДы / фарма
        h += `<div class="section-title">Приём добавок</div><button class="btn" style="width:100%" onclick="openSupplements()">💊 БАДы и фарма — курсы и напоминания</button>`;
        // Вес + график
        const wk = d.weight || { latest: null, history: [] };
        const wvals = (wk.history || []).map((x) => x.kg).reverse();
        const spark = (() => {
          if (wvals.length < 2) return "";
          const W = 280, H = 40, mn = Math.min(...wvals), mx = Math.max(...wvals), rng = mx - mn || 1;
          const pts = wvals.map((v, i) => `${(i / (wvals.length - 1) * W).toFixed(1)},${(H - (v - mn) / rng * (H - 6) - 3).toFixed(1)}`).join(" ");
          return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="40" preserveAspectRatio="none" style="margin-top:8px"><polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

        h += `<div class="section-title">Заметки о самочувствии</div>`;

    function taskActions(t) {

    function taskCard(t) {
      const due = fmtDue(t.due_at);
      const done = t.status === "done", closed = done || t.status === "failed";
      const doneTxt = t.done_at ? new Date(t.done_at).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) : "";
      let dueStyle = "";
      if (!closed && t.due_at) {
        const ms = new Date(t.due_at).getTime() - Date.now();
        const c = ms < 3600000 ? ["rgba(229,72,77,.18)", "#ff6b6b"] : ms < 86400000 ? ["rgba(240,171,0,.18)", "#f2b705"] : ["rgba(48,164,108,.18)", "#43c883"];
        dueStyle = `background:${c[0]};color:${c[1]};border-color:transparent;font-weight:700`;
      }
      return `<div class="card item ${done?'done':''}">
        <div class="top"><div class="name ${done?'done':''}">${esc(t.title)}</div>${t.client && !closed ? `<span class="pill" style="background:var(--fg);color:var(--fg-contrast);border-color:transparent;font-weight:700;flex:none">📁 ${esc(t.client)}</span>` : ""}</div>

    function calRenderList() {
      const el = $("calbody");
      if (!el) return;
      if (!calItems.length) { el.innerHTML = emptyBox("Пусто", "Нет встреч и задач со сроком. Добавь кнопкой «+»."); return; }
      const groups = {};
      calItems.forEach((it) => { const k = dayKey(new Date(it.at)); (groups[k] = groups[k] || []).push(it); });
      const today = dayKey(new Date()); const tmr = dayKey(new Date(Date.now() + 86400000));
      let h = "";
      Object.keys(groups).sort().forEach((k) => {
        const d = new Date(k + "T00:00");
        const label = k === today ? "Сегодня" : k === tmr ? "Завтра" : d.toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "long" });
        h += `<div class="section-title">${label}</div>` + groups[k].map(calItemRow).join("");

    function calRenderMonth() {
      const el = $("calbody"); if (!el) return;
      const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + calMonthOffset);
      const year = base.getFullYear(), month = base.getMonth();
      const counts = {};
      calItems.forEach((it) => { const k = dayKey(new Date(it.at)); counts[k] = (counts[k] || 0) + 1; });
      const first = new Date(year, month, 1);
      let lead = (first.getDay() + 6) % 7; // Пн=0
      const days = new Date(year, month + 1, 0).getDate();
      const today = dayKey(new Date());
      let cells = "";
      for (let i = 0; i < lead; i++) cells += `<div></div>`;
      for (let d = 1; d <= days; d++) {
        const k = `${year}-${p2(month+1)}-${p2(d)}`;
        const has = counts[k] || 0;
        const isToday = k === today, sel = k === calSelDay;
        cells += `<div onclick="calSelectDay('${k}')" style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;
          ${sel ? 'background:var(--fg);color:var(--fg-contrast);' : isToday ? 'border:1px solid var(--border-strong);' : ''}">
          ${d}<span style="height:5px;width:5px;border-radius:50%;margin-top:3px;background:${has ? (sel ? 'var(--fg-contrast)' : 'var(--fg)') : 'transparent'}"></span></div>`;
      }
      let h = `<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px">
          <button class="icon-btn" onclick="calPrev()">‹</button>
          <div style="font-weight:800;letter-spacing:-.02em">${MONTHS[month]} ${year}</div>
          <button class="icon-btn" onclick="calNext()">›</button></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:6px">${WD.map((w)=>`<div>${w}</div>`).join("")}</div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
        <div id="calday" style="margin-top:14px"></div>`;
      el.innerHTML = h;
      if (calSelDay) calRenderDay();
    }
    window.calSelectDay = (k) => { calSelDay = calSelDay === k ? null : k; calRenderMonth(); };
    function calRenderDay() {
      const box = $("calday"); if (!box) return;

    /* ---------- Голосовой ввод (запись PCM 16кГц → SpeechKit) ---------- */
    let micRec = null;
    function downsampleTo16k(data, from) {
      if (from <= 16000) return data;
      const ratio = from / 16000, outLen = Math.floor(data.length / ratio), out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) out[i] = data[Math.floor(i * ratio)];

      if (micRec) { if (mic) mic.style.color = "var(--muted)"; const bytes = await micRec.stop(); micRec = null; await sendVoice(bytes); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AC = window.AudioContext || window.webkitAudioContext;

        const proc = ac.createScriptProcessor(4096, 1, 1); const buf = [];

        src.connect(proc); proc.connect(ac.destination);

          proc.disconnect(); src.disconnect(); stream.getTracks().forEach((t) => t.stop());
          const rate = ac.sampleRate; await ac.close();
          let len = buf.reduce((s, a) => s + a.length, 0); const flat = new Float32Array(len); let o = 0;
          for (const a of buf) { flat.set(a, o); o += a.length; }
          const ds = downsampleTo16k(flat, rate); const i16 = new Int16Array(ds.length);

        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="saveTask()">Создать</button></div>`);
      window.__ts = taskScope;
      window.tsSet = (s) => { window.__ts = s; $("ts-work").classList.toggle("on", s === "work"); $("ts-personal").classList.toggle("on", s === "personal"); $("f-client-wrap").style.display = s === "personal" ? "none" : "block"; };
      tsSet(window.__ts);
    }
    window.saveTask = async () => {
      const title = $("f-title").value.trim(); if (!title) return tg.showAlert("Введи название");
      await api("/tasks", { method: "POST", body: JSON.stringify({ title, due: $("f-due").value, scope: window.__ts, priority: $("f-prio").checked ? 1 : 0, client_id: window.__ts === "personal" ? null : ($("f-client").value || null) }) });
      closeSheet(); taskScope = window.__ts; switchTab("tasks", true);
    };

    async function ensureClients() { if (!clientsCache.length) { try { clientsCache = (await api("/clients")).clients; } catch (e) {} } }
    function clientOptions(sel) { return ['<option value="">Без клиента</option>'].concat(clientsCache.map((c) => `<option value="${c.id}" ${String(sel) === String(c.id) ? "selected" : ""}>${esc(c.name)}</option>`)).join(""); }
    async function openAddEvent() {
      await ensureClients();
      const tm = me.telemost ? `<div class="field"><label class="check"><input type="checkbox" id="f-tm">🎥 Создать ссылку Телемост</label></div>` : "";
      openSheet(`<h3>Новая встреча</h3>
        <div class="field"><label>Название</label><input id="f-title" placeholder="Встреча с клиентом"></div>
        <div class="field"><label>Когда</label><input id="f-at" type="datetime-local"></div>
        <div class="field"><label>Клиент</label><select id="f-eclient">${clientOptions("")}</select></div>
        <div class="field"><label>Место</label><input id="f-loc" placeholder="офис / адрес / ссылка"></div>
        ${tm}
        <div class="field"><label>Заметки</label><textarea id="f-notes" placeholder="Повестка, ссылки…"></textarea></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="saveEvent()">Создать</button></div>`);
    }
    window.saveEvent = async () => {
      const title = $("f-title").value.trim(); const at = $("f-at").value;
      if (!title) return tg.showAlert("Введи название"); if (!at) return tg.showAlert("Выбери дату и время");
      const telemost = !!(document.getElementById("f-tm") && document.getElementById("f-tm").checked);
      try {
        await api("/events", { method: "POST", body: JSON.stringify({ title, at, location: $("f-loc").value, notes: $("f-notes").value, telemost, client_id: $("f-eclient") && $("f-eclient").value ? +$("f-eclient").value : null }) });
      } catch (e) { return tg.showAlert("Не удалось создать: " + (e.message || e)); }
      closeSheet(); renderCalendar();
    };

    function contactSheet(title, c, saveCall) {
      openSheet(`<h3>${title}</h3>
        <div class="field"><label>Имя</label><input id="f-name" value="${c ? esc(c.name) : ''}" placeholder="Имя Фамилия"></div>
        <div class="field"><label>День рождения</label><input id="f-bd" type="date" value="${c && c.birthday && c.birthday.length === 10 ? esc(c.birthday) : ''}"></div>
        <div class="field"><label>Телефон / контакт</label><input id="f-phone" value="${c ? esc(c.phone||'') : ''}" placeholder="+7… / @ник"></div>
        <div class="field"><label>Теги (через запятую)</label><input id="f-tags" value="${c ? esc(c.tags||'') : ''}" placeholder="клиент, друг, партнёр, VIP"></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="${saveCall}">Сохранить</button></div>`);
    }
    function contactBody() { return { name: $("f-name").value.trim(), birthday: $("f-bd").value || null, phone: $("f-phone").value, tags: $("f-tags").value }; }
    function openAddContact() { contactSheet("Новый контакт", null, "saveContact()"); }
    window.saveContact = async () => {
      const b = contactBody(); if (!b.name) return tg.showAlert("Введи имя");
      await api("/contacts", { method: "POST", body: JSON.stringify(b) });
      closeSheet(); afterContactChange();
    };
    window.editContact = (id) => { const c = contactsCache.find((x) => x.id === id); if (c) contactSheet("Изменить контакт", c, `saveContactEdit(${id})`); };
    window.saveContactEdit = async (id) => {
      const b = contactBody(); if (!b.name) return tg.showAlert("Введи имя");
      await api(`/contacts/${id}`, { method: "POST", body: JSON.stringify(b) });
      closeSheet(); afterContactChange();
    };

    /* Редактирование задачи */
    window.editTask = (id) => {
      const t = tasksCache.find((x) => x.id === id); if (!t) return;
      openSheet(`<h3>Изменить задачу</h3>
        <div class="field"><div class="seg mini"><div id="ts-work" onclick="tsSet('work')">Рабочая</div><div id="ts-personal" onclick="tsSet('personal')">Личная</div></div></div>
        <div class="field"><label>Что нужно сделать</label><input id="f-title" value="${esc(t.title)}"></div>
        <div class="field"><label>Дедлайн</label><input id="f-due" value="${isoToDueText(t.due_at)}" placeholder="завтра, в пятницу, 15.03 14:00"></div>
        <div class="field"><label class="check"><input type="checkbox" id="f-prio" ${t.priority ? "checked" : ""}>Важная задача</label></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="saveTaskEdit(${id})">Сохранить</button></div>`);
      window.__ts = t.scope || "work";
      window.tsSet = (s) => { window.__ts = s; $("ts-work").classList.toggle("on", s === "work"); $("ts-personal").classList.toggle("on", s === "personal"); };
      tsSet(window.__ts);
    };
    window.saveTaskEdit = async (id) => {
      const title = $("f-title").value.trim(); if (!title) return tg.showAlert("Введи название");
      await api(`/tasks/${id}`, { method: "POST", body: JSON.stringify({ title, due: $("f-due").value, scope: window.__ts, priority: $("f-prio").checked ? 1 : 0 }) });
      closeSheet(); renderTasks();
    };

    /* Редактирование встречи */
    window.editEvent = async (id) => {
      const e = eventsCache.find((x) => x.id === id); if (!e) return;
      await ensureClients();
      openSheet(`<h3>Изменить встречу</h3>
        <div class="field"><label>Название</label><input id="f-title" value="${esc(e.title)}"></div>
        <div class="field"><label>Когда</label><input id="f-at" type="datetime-local" value="${isoToLocalInput(e.starts_at)}"></div>
        <div class="field"><label>Клиент</label><select id="f-eclient">${clientOptions(e.client_id)}</select></div>
        <div class="field"><label>Место</label><input id="f-loc" value="${esc(e.location||'')}"></div>
        <div class="field"><label>Заметки</label><textarea id="f-notes">${esc(e.notes||'')}</textarea></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="saveEventEdit(${id})">Сохранить</button></div>`);
    };
    window.saveEventEdit = async (id) => {
      const title = $("f-title").value.trim(); const at = $("f-at").value;
      if (!title) return tg.showAlert("Введи название"); if (!at) return tg.showAlert("Выбери дату и время");
      await api(`/events/${id}`, { method: "POST", body: JSON.stringify({ title, at, location: $("f-loc").value, notes: $("f-notes").value, client_id: $("f-eclient") && $("f-eclient").value ? +$("f-eclient").value : null }) });
      closeSheet(); renderCalendar();
    };

    /* Полная карточка клиента */
    window.openClientCard = async (id) => {
      openSheet(`<h3>Карточка клиента</h3><div id="cc-body"><div class="loading">Загрузка…</div></div>`);
      try {
        const d = await api(`/clients/${id}`);
        const c = d.client, cnt = d.counts || {};
        const PLAT = { direct: "Директ", google: "Google Ads", tg: "TG Ads", vk: "VK", avito: "Авито", site: "Сайт" };
        const plats = (c.platforms || "").split(",").filter(Boolean).map((p) => PLAT[p] || p).join(", ");
        const STAGE = { open: "Неразобранное", in_progress: "В работе", done: "Выполнено", failed: "Не выполнено" };
        let h = `<div style="font-size:20px;font-weight:800;margin-bottom:6px">${c.status === "active" ? "● " : "○ "}${esc(c.name)}</div>`;
        h += `<div class="meta" style="margin-bottom:10px">${plats ? `<span class="pill">${esc(plats)}</span>` : ""}${c.budget ? `<span class="pill">бюджет ${money(c.budget)}</span>` : ""}${c.pay_amount ? `<span class="pill strong">ведение ${money(c.pay_amount)}</span>` : ""}${c.pay_due ? `<span class="pill">оплата ${esc(c.pay_due)}</span>` : ""}${c.metrika_counter ? `<span class="pill">Метрика ${esc(c.metrika_counter)}</span>` : ""}${c.direct_login ? `<span class="pill">Директ ${esc(c.direct_login)}</span>` : ""}</div>`;
        h += `<div class="actions" style="margin-top:0">${c.metrika_counter ? `<button class="btn primary" onclick="openReport(${c.id})">📊 Отчёт</button>` : ""}<button class="btn" onclick="editClient(${c.id})">Изменить</button><button class="btn" onclick="toggleClient(${c.id},'${c.status === "active" ? "paused" : "active"}')">${c.status === "active" ? "Пауза" : "Вернуть"}</button></div>`;
        h += `<div class="section-title">Задачи · ${d.tasks.length}</div>`;
        h += `<div class="meta" style="margin-bottom:8px"><span class="pill">Неразобр. ${cnt.open || 0}</span><span class="pill">В работе ${cnt.in_progress || 0}</span><span class="pill">Готово ${cnt.done || 0}</span><span class="pill">Не вып. ${cnt.failed || 0}</span></div>`;
        h += d.tasks.length
          ? `<div class="card">` + d.tasks.map((t) => { const due = fmtDue(t.due_at); return `<div class="agenda-item"><div class="dot ${t.status === "done" ? "" : "strong"}"></div><div class="t"><div class="ttl">${esc(t.title)}</div><div class="m">${STAGE[t.status] || t.status}${due.txt ? " · " + due.txt : ""}</div></div></div>`; }).join("") + `</div>`
          : `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Задач нет</div></div>`;
        h += `<div class="section-title">Встречи</div>`;
        h += d.events.length
          ? `<div class="card">` + d.events.map((e) => `<div class="agenda-item"><div class="dot"></div><div class="t"><div class="ttl">${esc(e.title)}</div><div class="m">${fmtEv(e.starts_at)}${e.location ? " · " + esc(e.location) : ""}</div></div></div>`).join("") + `</div>`
          : `<div class="card"><div style="color:var(--muted);text-align:center;padding:6px">Встреч нет</div></div>`;
        h += `<div class="section-title">Заметки</div><div class="field"><textarea id="cc-notes" placeholder="Заметки по клиенту…">${esc(c.notes || "")}</textarea></div><button class="btn sm" onclick="saveClientNotes(${c.id})">Сохранить заметку</button>`;
        setHTML("cc-body", h);
      } catch (e) { setHTML("cc-body", `<div class="card"><div style="padding:6px;color:var(--muted)">Ошибка: ${esc(e.message || e)}</div></div>`); }
    };
    window.saveClientNotes = async (id) => { try { await api(`/clients/${id}`, { method: "POST", body: JSON.stringify({ notes: $("cc-notes").value }) }); tg.showAlert("Заметка сохранена"); } catch (e) { tg.showAlert("Ошибка"); } };

    /* Клиенты */
    function clientSheet(title, c, saveCall) {
      openSheet(`<h3>${title}</h3>
        <div class="field"><label>Название</label><input id="f-name" value="${c ? esc(c.name) : ''}" placeholder="Компания / проект"></div>
        <div class="field"><label>Площадки / услуги</label><input id="f-plat" value="${c ? esc(c.platforms||'') : ''}" placeholder="Директ, VK, сайт"></div>
        <div class="field"><label>Рекламный бюджет</label><input id="f-budget" value="${c ? esc(c.budget||'') : ''}" placeholder="напр. 100 000 ₽/мес"></div>
        <div class="field"><label>Сумма за ведение</label><input id="f-pay" value="${c ? esc(c.pay_amount||'') : ''}" placeholder="напр. 30 000 ₽/мес"></div>
        <div class="field"><label>Дедлайн оплаты</label><input id="f-paydue" value="${c ? esc(c.pay_due||'') : ''}" placeholder="напр. 5 число / 15.08"></div>
        <div class="field"><label>Счётчик Яндекс Метрики</label><input id="f-metrika" value="${c ? esc(c.metrika_counter||'') : ''}" placeholder="напр. 12345678" inputmode="numeric"></div>
        <div class="field"><label>Логин Яндекс Директ</label><input id="f-direct" value="${c ? esc(c.direct_login||'') : ''}" placeholder="логин рекламного аккаунта"></div>
        <div class="actions"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="${saveCall}">Сохранить</button></div>`);
    }
    function clientBody() {
      return { name: $("f-name").value.trim(), platforms: $("f-plat").value, budget: $("f-budget").value, pay_amount: $("f-pay").value, pay_due: $("f-paydue").value, metrika_counter: $("f-metrika").value, direct_login: $("f-direct").value };
    }
    function openAddClient() { clientSheet("Новый клиент", null, "saveClient()"); }
    window.saveClient = async () => {
      const b = clientBody(); if (!b.name) return tg.showAlert("Введи название");
      await api("/clients", { method: "POST", body: JSON.stringify(b) });
      closeSheet(); renderClients();
    };
    window.editClient = (id) => { const c = clientsCache.find((x) => x.id === id); if (c) clientSheet("Изменить клиента", c, `saveClientEdit(${id})`); };
    window.saveClientEdit = async (id) => {
      const b = clientBody(); if (!b.name) return tg.showAlert("Введи название");
      await api(`/clients/${id}`, { method: "POST", body: JSON.stringify(b) });
      closeSheet(); renderClients();
    };
    window.toggleClient = async (id, status) => { haptic(); await api(`/clients/${id}/status`, { method: "POST", body: JSON.stringify({ status }) }); renderClients(); };
    window.delClient = async (id) => { if (!(await ask("Удалить клиента?"))) return; await api(`/clients/${id}`, { method: "DELETE" }); renderClients(); };

    $("fab").onclick = () => { haptic(); if (tab === "tasks") openAddTask(); else if (tab === "calendar") openAddEvent(); else if (tab === "health") openFoodAdd(); else if (tab === "clients") openAddClient(); };
    function updateFab() { $("fab").style.display = ["tasks", "calendar", "health", "clients"].includes(tab) ? "flex" : "none"; }

    /* ---------- Навигация + кнопка «Назад» ---------- */
    function renderTab(t) {
      tab = t;
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("on", a.dataset.tab === t));
      updateFab();
      if (t === "home") renderHome();
      else if (t === "tasks") renderTasks();
      else if (t === "calendar") renderCalendar();
      else if (t === "health") renderHealth();
      else if (t === "clients") renderClients();
      else if (t === "ai") renderAI();
    }
    // viaNav=true — переход по нижнему меню (сбрасывает историю); иначе — вглубь (можно вернуться)
    function switchTab(t, viaNav) {
      if (viaNav) { navStack.length = 0; navStack.push(t); }
      else if (navStack[navStack.length - 1] !== t) navStack.push(t);
      renderTab(t); updateBack();
      window.scrollTo(0, 0);
    }
    window.switchTab = switchTab;
    window.go = (t, scope) => { if (scope) taskScope = scope; switchTab(t, false); };

    function updateBack() {
      if (sheetOpen || navStack.length > 1) tg.BackButton.show();
      else tg.BackButton.hide();
    }
    tg.BackButton.onClick(() => {
      haptic();
      if (sheetOpen) { closeSheet(); return; }
      if (navStack.length > 1) { navStack.pop(); renderTab(navStack[navStack.length - 1]); }
      updateBack();
    });

    document.querySelectorAll(".nav a").forEach((a) => a.onclick = () => { haptic(); switchTab(a.dataset.tab, true); });

    /** Сырые initData мини-приложения: у разных сборок MAX объект называется по-разному. */
    function bridgeInitData() {
      try {
        const b = window.WebApp || window.MAX || window.maxWebApp || window.maxBridge || null;
        const raw = b && (b.initData || b.initDataRaw || b.initDataUnsafe?.raw);
        if (raw && typeof raw === "string") return raw;
        const h = (location.hash || "").replace(/^#/, "");
        return /(^|&)hash=/.test(h) ? h : "";
      } catch (e) {
        return "";
      }
    }

    /** Пробуем войти по подписи мини-приложения. true — вошли, страница перезагрузится. */
    async function tryBridgeLogin() {
      const raw = bridgeInitData();
      if (!raw) return false;
      try {
        const res = await fetch("/api/auth/max", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: raw }),
        });
        if (!res.ok) return false;
        const d = await res.json();
        if (!d.token) return false;
        localStorage.setItem(MAX_KEY, d.token);
        location.reload();
        return true;
      } catch (e) {
        return false;
      }
    }

    /** Экран входа: код из чата с ботом. */
    function renderLogin(note) {
      $("subtitle").textContent = "Нужен вход";
      view.innerHTML = `
        <div class="card" style="padding:18px;text-align:center">
          <img src="${SARA}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;margin:2px auto 12px">
          <div style="font-size:17px;font-weight:700;margin-bottom:6px">Вход в Сару</div>
          <div style="color:var(--muted);font-size:13.5px;line-height:1.45;margin-bottom:16px">
            Отправь боту в чате команду <b>/code</b> — он пришлёт код из 8 символов. Введи его один раз, дальше приложение будет открываться сразу.
          </div>
          <div class="field" style="text-align:left">
            <label>Код из чата</label>
            <input id="login-code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false"
                   placeholder="Например, K7QM4XZP" style="text-transform:uppercase;letter-spacing:2px;font-weight:700">
          </div>
          <div id="login-msg" style="color:var(--muted);font-size:12.5px;min-height:18px;margin-bottom:10px">${note ? esc(note) : ""}</div>
          <button class="btn primary" style="width:100%" onclick="submitLoginCode()">Войти</button>
          <div id="login-build" style="color:var(--muted);font-size:11px;margin-top:10px;opacity:.7"></div>
        </div>`;
      fetch("/version", { cache: "no-store" })
        .then((r) => r.text())
        .then((v) => { const el = $("login-build"); if (el) el.textContent = "сборка " + v; })
        .catch(() => {});
      const input = $("login-code");
      if (input) {
        input.focus();
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") submitLoginCode(); });
      }
    }

    window.submitLoginCode = async () => {
      const input = $("login-code");
      const msg = $("login-msg");
      const code = (input?.value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length !== 8) { if (msg) msg.textContent = "Код состоит из 8 символов."; return; }
      if (msg) msg.textContent = "Проверяю…";
      try {
        const res = await fetch("/api/auth/code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok || !d.token) {
          if (msg) msg.textContent = d.error === "no_access" ? "Доступ ещё не подтверждён владельцем." : "Код не подошёл — запроси новый командой /code.";
          return;
        }
        localStorage.setItem(MAX_KEY, d.token);
        location.reload();
      } catch (e) {
        if (msg) msg.textContent = "Не получилось. Попробуй ещё раз.";
      }
    };

    (async () => {
      try {
        me = await api("/me");
        const name = tg.initDataUnsafe?.user?.first_name || "";
        const hour = new Date().getHours();
        const hi = hour < 6 ? "Доброй ночи" : hour < 12 ? "Доброе утро" : hour < 18 ? "Добрый день" : "Добрый вечер";
        $("greeting").textContent = `${hi}${name ? ", " + name : ""}`;
        $("subtitle").textContent = me.role === "owner" ? "Личный ассистент" : me.role === "member" ? "Команда" : "Личный аккаунт";
        if (me.role === "owner") $("admin-btn").style.display = "";
        // Личный аккаунт — без клиентской базы владельца
        if (me.role === "client") {
          const cl = document.querySelector('.nav a[data-tab="clients"]');
          if (cl) cl.remove();
        }
      } catch (e) {
        const m = String(e.message || e);
        if (m === "unauthorized") {
          // Открыли кнопкой мини-приложения в MAX: сначала пробуем подпись, иначе — код из чата
          if (await tryBridgeLogin()) return;
          renderLogin("");
        } else {
          $("subtitle").textContent = "Нет доступа";
          view.innerHTML = emptyBox("Нет доступа", "Открой приложение из своего бота и получи доступ у владельца.");
        }
        return;
      }
      renderTab("home"); updateBack();
    })();
  </script>
</body>
</html>
