      { id: "rob", name: "\u0420\u043e\u0431", svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 96 96\" width=\"96\" height=\"96\"><circle cx=\"48\" cy=\"48\" r=\"48\" fill=\"#e3e9ee\"/><path d=\"M28 52c0-11 9-20 20-20s20 9 20 20v6c0 11-9 20-20 20s-20-9-20-20z\" fill=\"#cfd6dd\"/><path d=\"M24 96c2-14 11-22 24-22s22 8 24 22z\" fill=\"#9aa7b3\" opacity=\".9\"/><path d=\"M30 38h36v6H30z\" fill=\"#9aa7b3\"/><g fill=\"#2b2b2b\"><circle cx=\"40\" cy=\"53\" r=\"2.6\"/><circle cx=\"56\" cy=\"53\" r=\"2.6\"/></g><path d=\"M43 63c3 2 7 2 10 0\" stroke=\"#2b2b2b\" stroke-width=\"2.4\" stroke-linecap=\"round\" fill=\"none\"/><g fill=\"none\" stroke=\"#5b6773\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M48 24v8\"/><path d=\"M36 70h24\"/></g><circle cx=\"48\" cy=\"21\" r=\"3.5\" fill=\"#5b6773\"/></svg>" },
    ];
    const faceSrc = (svg) => "data:image/svg+xml;utf8," + encodeURIComponent(svg);

    /** Картинка ассистента: готовое лицо, своя ссылка или стандартное фото. */
    function avatarSrc(v) {
      if (!v) return SARA;
      const f = FACES.find((x) => x.id === v.replace(/^face:/, ""));
      if (f) return faceSrc(f.svg);
      return /^https:\/\//.test(v) ? v : SARA;
    }

    window.openSara = () => {
      haptic();
      const seg = (key, opts) =>
        `<div class="seg" style="margin:0">${opts.map(([v, label]) => `<div class="${prefs[key] === v ? "on" : ""}" onclick="setSara('${key}','${v}')">${label}</div>`).join("")}</div>`;
      const block = (title, body) =>
        `<div class="card" style="padding:12px;margin-bottom:8px"><div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">${title}</div>${body}</div>`;

      openSheet(`<h3>Кто такая ${esc(prefs.botName || "Сара")}</h3>
        <div style="color:var(--muted);font-size:12.5px;margin:-4px 2px 12px">Имя, лицо и манера общения. Это влияет и на то, как она отвечает в чате.</div>
        <div style="text-align:center;margin-bottom:14px">
          <img src="${avatarSrc(prefs.avatar)}" onerror="this.src='${SARA}'" alt=""
               style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">
        </div>
        ${block("Имя", `<div class="field" style="margin:0"><div class="with-mic"><input id="sara-name" value="${esc(prefs.botName)}" placeholder="Сара" onchange="setSara('botName', this.value)">${micButton("sara-name")}</div></div>`)}
        ${block("Лицо",
          `<div class="faces">
             <button type="button" class="face ${!prefs.avatar ? "on" : ""}" onclick="setSara('avatar','')" title="Сара">
               <img src="${SARA}" alt="Сара"><span>Сара</span>
             </button>
             ${FACES.map((f) => `
               <button type="button" class="face ${prefs.avatar === "face:" + f.id ? "on" : ""}" onclick="setSara('avatar','face:${f.id}')" title="${esc(f.name)}">
                 <img src="${faceSrc(f.svg)}" alt="${esc(f.name)}"><span>${esc(f.name)}</span>
               </button>`).join("")}
           </div>
           <details style="margin-top:10px">
             <summary style="color:var(--muted);font-size:12.5px;cursor:pointer">Своя картинка по ссылке</summary>
             <div class="field" style="margin:8px 0 0">
               <input id="sara-ava" value="${/^https:/.test(prefs.avatar) ? esc(prefs.avatar) : ""}" placeholder="https://…" onchange="setSara('avatar', this.value.trim())">
             </div>
           </details>`)}
        ${block("Манера общения", seg("tone", [["friendly", "Дружелюбно"], ["business", "По-деловому"], ["brief", "Кратко"]]))}
        ${block("Обращение", seg("address", [["ty", "На «ты»"], ["vy", "На «вы»"]]))}
        ${block("Поиск в интернете",
          `<label class="check" style="justify-content:space-between;width:100%;align-items:flex-start">
             <span><span style="font-weight:600">Искать свежее в сети</span><br><span style="color:var(--muted);font-size:12px">Для вопросов про новости, цены и события. Твои задачи и здоровье в интернет не уходят.</span></span>
             <input type="checkbox" ${prefs.search ? "checked" : ""} onchange="setSara('search', this.checked)">
           </label>`)}
        ${block("Эмодзи в ответах",
          `<label class="check" style="justify-content:space-between;width:100%">
             <span>Разрешить эмодзи</span>
             <input type="checkbox" ${prefs.emoji ? "checked" : ""} onchange="setSara('emoji', this.checked)">
           </label>`)}
        ${block("Как обращаться ко мне",
          `<div class="field" style="margin:0"><input id="sara-callme" value="${esc(prefs.callMe)}" placeholder="например, Дмитрий" onchange="setSara('callMe', this.value.trim())"></div>`)}
        <div class="actions" style="margin-top:4px">
          <button class="btn" onclick="openProfile()">Что она обо мне знает</button>
          <button class="btn primary" onclick="closeSheet()">Готово</button>
        </div>`);
    };

    window.setSara = (key, value) => {
      haptic();
      savePrefs({ [key]: value });
        const y = sheetBody.scrollTop;
      openSara();

    /* ---------- Настройки ---------- */
    window.openSettings = () => {
      const seg = (key, opts) =>
        `<div class="seg" style="margin:0">${opts

          .join("")}</div>`;
      const toggle = (key, label, hint) =>
        `<label class="check" style="justify-content:space-between;width:100%;align-items:flex-start">
           <span><span style="font-weight:600">${label}</span>${hint ? `<br><span style="color:var(--muted);font-size:12px">${hint}</span>` : ""}</span>
           <input type="checkbox" ${prefs[key] ? "checked" : ""} onchange="setPref('${key}', this.checked)">
         </label>`;
      const block = (title, body) =>
        `<div class="card" style="padding:12px;margin-bottom:8px">
           <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">${title}</div>${body}
         </div>`;
      const tabsList = ["home", "tasks", "calendar", "health", "clients", "ai"]
        .filter((t) => t !== "clients" || me.role !== "client")
        .map((t) => `<label class="check" style="justify-content:space-between;width:100%">
             <span>${TAB_NAMES[t]}</span>

           </label>`).join("");
      const startOpts = ["home", "tasks", "calendar", "health", "ai"]
        .map((t) => `<option value="${t}" ${prefs.startTab === t ? "selected" : ""}>${TAB_NAMES[t]}</option>`).join("");

      openSheet(`<h3>Настройки</h3>
        <div style="color:var(--muted);font-size:12.5px;margin:-4px 2px 10px">Меняется сразу — можно крутить и смотреть. Настройки свои у каждого аккаунта.</div>
        ${block("Размер интерфейса",
          `<div style="display:flex;align-items:center;gap:10px">
             <span style="font-size:13px;color:var(--muted)">А</span>
             <input type="range" min="85" max="130" step="5" value="${prefs.scale}" style="flex:1"

             <span style="font-size:19px;color:var(--muted)">А</span>
             <span id="scale-val" style="width:46px;text-align:right;font-weight:700">${prefs.scale}%</span>
           </div>`)}
        ${block("Плотность", seg("density", [["compact", "Плотно"], ["normal", "Обычно"], ["roomy", "Просторно"]]))}
        ${block("Картинки и аватары", seg("images", [["small", "Мельче"], ["normal", "Обычные"], ["large", "Крупнее"]]))}
        ${block("Скругления", seg("corners", [["sharp", "Острые"], ["normal", "Обычные"], ["soft", "Мягкие"]]))}
        ${block("Оформление", seg("theme", [["auto", "Как в системе"], ["light", "Светлая"], ["dark", "Тёмная"]]))}
        ${block("Поведение",
          toggle("motion", "Анимации", "Переливы и плавные переходы") +
          toggle("haptic", "Отклик вибрацией", "Короткая вибрация на нажатия") +
          `<div class="field" style="margin:8px 0 0"><label>Открывать на экране</label>
             <select onchange="setPref('startTab', this.value)">${startOpts}</select></div>`)}
        ${block("Разделы внизу", `<div style="color:var(--muted);font-size:12px;margin:-4px 0 6px">Лишнее можно убрать из меню — данные останутся.</div>${tabsList}`)}
        ${block("Сама Сара", `<div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">Имя, лицо и манера общения — на отдельном экране.</div><button class="btn" style="width:100%" onclick="closeSheet(); setTimeout(openSara, 180)">Открыть настройки Сары</button>`)}
        <div class="actions" style="margin-top:4px">
          <button class="btn" onclick="resetPrefs()">Сбросить</button>
          <button class="btn primary" onclick="closeSheet()">Готово</button>
        </div>`);
    };

    /** Ползунок масштаба: показываем результат прямо во время перетаскивания. */
    window.previewScale = (v) => {
      document.documentElement.style.zoom = +v / 100;
      const el = $("scale-val"); if (el) el.textContent = v + "%";
    };
    window.setPref = (key, value) => {
      haptic();
      savePrefs({ [key]: value });

      if (["density", "images", "corners", "theme"].includes(key)) {
        const y = sheetBody.scrollTop;
        openSettings();
        sheetBody.scrollTop = y;
      }
    };
    window.toggleTab = (t, visible) => {
      haptic();
      const hidden = prefs.hidden.filter((x) => x !== t);
      if (!visible) hidden.push(t);
      savePrefs({ hidden });
    };
    window.resetPrefs = () => {
      ask("Вернуть внешний вид по умолчанию?\nЗадачи, встречи и здоровье это не затронет.", { ok: "Сбросить" }).then((ok) => {
        if (!ok) return;
        savePrefs({ ...PREFS_DEFAULT });
        openSettings();
      });
    };

    window.openNotif = async () => {
      openSheet(`<h3>Уведомления</h3><div id="notif-body"><div class="loading">Загрузка…</div></div>`);
      try {
        const n = await api("/notifications");
        const row = (label, id, checked) => `<label class="check" style="justify-content:space-between;width:100%"><span>${label}</span><input type="checkbox" id="${id}" ${checked ? "checked" : ""}></label>`;
        let h = `<div class="card" style="padding:12px">${row("☀️ Утренний брифинг", "n-morning", n.morning.on)}<div class="field" style="margin:8px 0 0"><label>Час брифинга (0–23)</label><input id="n-morning-h" type="number" inputmode="numeric" min="0" max="23" value="${n.morning.hour}"></div></div>`;
        h += `<div class="card" style="padding:12px;margin-top:8px">${row("✅ Дедлайны задач", "n-tasks", n.tasks.on)}</div>`;
        h += `<div class="card" style="padding:12px;margin-top:8px">${row("📅 Встречи", "n-events", n.events.on)}<div class="field" style="margin:8px 0 0"><label>За сколько минут напоминать</label><input id="n-events-lead" type="number" inputmode="numeric" value="${n.events.lead}"></div></div>`;
        h += `<div class="card" style="padding:12px;margin-top:8px">${row("🎂 Дни рождения", "n-bd", n.birthdays.on)}</div>`;
        h += `<div class="card" style="padding:12px;margin-top:8px">${row("💧 Напоминать пить воду", "n-water", n.water.on)}<div style="display:flex;gap:8px;margin-top:8px"><div class="field" style="flex:1"><label>Каждые, ч</label><input id="n-water-every" type="number" inputmode="numeric" value="${n.water.everyHours}"></div><div class="field" style="flex:1"><label>С часа</label><input id="n-water-from" type="number" inputmode="numeric" value="${n.water.from}"></div><div class="field" style="flex:1"><label>До часа</label><input id="n-water-to" type="number" inputmode="numeric" value="${n.water.to}"></div></div></div>`;
        h += `<div class="card" style="padding:12px;margin-top:8px">${row("🍽 Напоминать записать еду", "n-meals", n.meals.on)}<div style="display:flex;gap:8px;margin-top:8px"><div class="field" style="flex:1"><label>Завтрак, ч</label><input id="n-meals-b" type="number" inputmode="numeric" value="${n.meals.breakfast}"></div><div class="field" style="flex:1"><label>Обед, ч</label><input id="n-meals-l" type="number" inputmode="numeric" value="${n.meals.lunch}"></div><div class="field" style="flex:1"><label>Ужин, ч</label><input id="n-meals-d" type="number" inputmode="numeric" value="${n.meals.dinner}"></div></div></div>`;
        h += `<div class="actions" style="margin-top:12px"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="saveNotif()">Сохранить</button></div>`;
        setHTML("notif-body", h);
      } catch (e) { setHTML("notif-body", `<div class="card"><div style="padding:6px;color:var(--muted)">Ошибка: ${esc(e.message || e)}</div></div>`); }
    };
    window.saveNotif = async () => {
      const on = (id) => ($(id) ? $(id).checked : false);
      const num = (id) => ($(id) ? +$(id).value : 0);
      const body = {
        morning: { on: on("n-morning"), hour: num("n-morning-h") },
        tasks: { on: on("n-tasks") },
        events: { on: on("n-events"), lead: num("n-events-lead") },
        birthdays: { on: on("n-bd") },

      };
      try { await api("/notifications", { method: "POST", body: JSON.stringify(body) }); } catch (e) { return tg.showAlert("Ошибка сохранения"); }
      closeSheet(); tg.showAlert("Настройки уведомлений сохранены");
    };

    /* ---------- Админка: доступы (только владелец) ---------- */
    const ROLE_RU = { owner: "Владелец", member: "Команда", client: "Личный аккаунт", pending: "Ждёт подтверждения" };

    window.openAdmin = async () => {
      openSheet(`<h3>Доступы</h3><div style="color:var(--muted);font-size:12.5px;margin:-4px 2px 10px">Кто пользуется ботом и с какими правами. Личные задачи и здоровье этих аккаунтов остаются закрытыми — здесь только доступ.</div><div id="adm-body"><div class="loading">Загрузка…</div></div>`);
      renderAdmin();
    };

    async function renderAdmin() {
      try {
        const { users } = await api("/admin/users");
        const mo = await api("/admin/max-owner").catch(() => ({ id: "" }));
        let h = `<div class="card" style="padding:12px;margin-bottom:8px">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:6px">ИИ</div>

    function micButton(inputId) {

          proc.disconnect(); src.disconnect(); stream.getTracks().forEach((t) => t.stop());
          const rate = ac.sampleRate; await ac.close();
          let len = buf.reduce((s, a) => s + a.length, 0); const flat = new Float32Array(len); let o = 0;
          for (const a of buf) { flat.set(a, o); o += a.length; }
          const ds = downsampleTo16k(flat, rate); const i16 = new Int16Array(ds.length);
          for (let i = 0; i < ds.length; i++) { const s = Math.max(-1, Math.min(1, ds[i])); i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
          return new Uint8Array(i16.buffer);
        } };
        if (btn) { btn.classList.add("rec"); btn.style.color = ""; }
        haptic();
      } catch (e) {
        tg.showAlert("Микрофон недоступен. Разреши доступ в настройках или продиктуй голосовым в чате бота.");
      }
    }

    /** Останавливаем запись и раскладываем распознанный текст по назначению. */
    async function stopDictation() {
      if (!micRec) return;
      const btn = micRec.btn;
      if (btn) btn.classList.remove("rec");
      const bytes = await micRec.stop();
      micRec = null;
      if (btn) btn.classList.add("busy");
      const text = await recognize(bytes);
      if (btn) btn.classList.remove("busy");
      if (!text) return;
      if (micTarget === "ai") { aiSend(text); return; }
      const input = $(micTarget);
      if (!input) return;
      // дописываем, а не затираем: можно надиктовать в несколько приёмов
      input.value = input.value ? `${input.value.trim()} ${text}` : text;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.focus();
    }

    /** Отправляет запись на распознавание. Возвращает текст или пустую строку. */
    async function recognize(bytes) {
      if (!bytes || bytes.byteLength < 1600) return "";
      try {
        const res = await fetch("/api/voice", { method: "POST", headers: AUTH_HEADERS, body: bytes });
        const d = await res.json().catch(() => ({}));
        if (res.ok && d.text) return d.text;
        tg.showAlert(d.message || "Не расслышала, попробуй ещё раз ближе к микрофону.");
      } catch (e) {

      }
      return "";
    }

    function openAddClient() { clientSheet("Новый клиент", null, "saveClient()"); }
    window.saveClient = async () => {
      const b = clientBody(); if (!b.name) return tg.showAlert("Введи название");
      await api("/clients", { method: "POST", body: JSON.stringify(b) });
      closeSheet(); renderClients();
    };
    window.editClient = (id) => { const c = clientsCache.find((x) => x.id === id); if (c) clientSheet("Изменить клиента", c, `saveClientEdit(${id})`); };
    window.saveClientEdit = async (id) => {
      const b = clientBody(); if (!b.name) return tg.showAlert("Введи название");
      await api(`/clients/${id}`, { method: "POST", body: JSON.stringify(b) });
      closeSheet(); renderClients();
    };
    window.toggleClient = async (id, status) => { haptic(); await api(`/clients/${id}/status`, { method: "POST", body: JSON.stringify({ status }) }); renderClients(); };
    window.delClient = async (id) => { if (!(await ask("Удалить клиента?\nЗадачи и встречи клиента останутся, но потеряют привязку.", { ok: "Удалить", danger: true }))) return; await api(`/clients/${id}`, { method: "DELETE" }); renderClients(); };

    $("fab").onclick = () => { haptic(); if (tab === "tasks") openAddTask(); else if (tab === "calendar") openAddEvent(); else if (tab === "health") openFoodAdd(); else if (tab === "clients") openAddClient(); };
    function updateFab() { $("fab").style.display = ["tasks", "calendar", "health", "clients"].includes(tab) ? "flex" : "none"; }

    /* ---------- Навигация + кнопка «Назад» ---------- */
    function renderTab(t) {
      tab = t;
      document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("on", a.dataset.tab === t));
      updateFab();
      const draw = { home: renderHome, tasks: renderTasks, calendar: renderCalendar, health: renderHealth, clients: renderClients, ai: renderAI }[t];
      if (!draw) return;
      const warm = restoreTab(t);
      Promise.resolve(draw(warm)).then(() => rememberTab(t)).catch(() => {});
    }
    // viaNav=true — переход по нижнему меню (сбрасывает историю); иначе — вглубь (можно вернуться)
    function switchTab(t, viaNav) {
      if (viaNav) { navStack.length = 0; navStack.push(t); }
      else if (navStack[navStack.length - 1] !== t) navStack.push(t);
      renderTab(t); updateBack();
      window.scrollTo(0, 0);
    }
    window.switchTab = switchTab;
    window.go = (t, scope) => { if (scope) taskScope = scope; switchTab(t, false); };

    function updateBack() {
      if (sheetOpen || navStack.length > 1) tg.BackButton.show();
      else tg.BackButton.hide();
    }
    tg.BackButton.onClick(() => {
      haptic();
      if (sheetOpen) { closeSheet(); return; }
      if (navStack.length > 1) { navStack.pop(); renderTab(navStack[navStack.length - 1]); }
      updateBack();
    });

    document.querySelectorAll(".nav a").forEach((a) => a.onclick = () => { haptic(); switchTab(a.dataset.tab, true); });

    /**
     * Данные запуска от мессенджера. Названия объектов у разных сборок MAX отличаются,
     * поэтому перебираем всё, что похоже на мост, плюс параметры адреса и хеш.
     */
    function bridgeScan() {
      // адрес чистится сразу после старта, поэтому запоминаем разбор первого вызова
      if (launchScan) return launchScan;
      const out = { params: {}, hash: "", bridges: {}, initData: "", startParam: "", initKeys: "" };
      try {
        const q = new URLSearchParams(location.search);
        for (const [k, v] of q.entries()) out.params[k] = String(v).slice(0, 200);
        out.hash = (location.hash || "").slice(0, 400);

        const names = ["WebApp", "MAX", "Max", "maxWebApp", "maxBridge", "MaxWebApp", "Telegram", "webApp", "miniApp", "MiniApp", "AppBridge", "bridge"];
        for (const n of names) {
          const o = window[n];
          if (!o || typeof o !== "object") continue;
          const keys = Object.keys(o).slice(0, 25);
          out.bridges[n] = keys;
          const nested = o.WebApp && typeof o.WebApp === "object" ? o.WebApp : null;
          if (nested) out.bridges[n + ".WebApp"] = Object.keys(nested).slice(0, 25);
          const src = nested || o;
          const raw = src.initData || src.initDataRaw || src.initDataUnsafe?.raw;
          if (!out.initData && typeof raw === "string" && raw) out.initData = raw;
          const sp = src.startParam || src.start_param || src.initDataUnsafe?.start_param;
          if (!out.startParam && typeof sp === "string" && sp) out.startParam = sp;
        }
        // MAX отдаёт данные запуска в адресе: токен кнопки — в параметре
        // WebAppStartParam, подпись — в хеше #WebAppData=…
        const startKeys = ["webappstartparam", "tgwebappstartparam", "max", "startapp", "start_param", "startparam", "payload", "token"];
        const lowered = {};
        for (const k of Object.keys(out.params)) lowered[k.toLowerCase()] = out.params[k];
        for (const k of startKeys) {
          if (!out.startParam && lowered[k]) out.startParam = lowered[k];
        }
        const hashParams = new URLSearchParams(out.hash.replace(/^#/, ""));
        for (const [k, v] of hashParams.entries()) {
          const lk = k.toLowerCase();
          if (!out.initData && (lk === "webappdata" || lk === "tgwebappdata")) out.initData = v;
          if (!out.startParam && startKeys.includes(lk)) out.startParam = v;
        }
        if (!out.initData && /(^|&)hash=/.test(out.hash.replace(/^#/, ""))) out.initData = out.hash.replace(/^#/, "");
        out.initKeys = out.initData ? [...new URLSearchParams(out.initData).keys()].join(",") : "";
      } catch (e) {
        out.error = String(e);
      }
      launchScan = out;
      return out;
    }

    function bridgeInitData() {
      return bridgeScan().initData;
    }

    /** Хранилища мини-приложения MAX: переживают закрытие окна, в отличие от localStorage в webview. */
    function maxStores() {
      const w = window.WebApp || window.MAX || {};
      return [w.SecureStorage, w.DeviceStorage, w.secureStorage, w.deviceStorage].filter(
        (s) => s && typeof s.getItem === "function"
      );
    }

    async function maxStoreGet(key) {
      for (const st of maxStores()) {
        try {
          const r = await st.getItem(key);
          const v = typeof r === "string" ? r : r && r.value;
          if (v) return String(v);
        } catch (e) {}
      }
      return "";
    }

    async function maxStoreSet(key, value) {
      for (const st of maxStores()) {
        try { await st.setItem(key, value); } catch (e) {}
      }
    }

    /** Запоминаем сессию всеми доступными способами — чтобы вход спрашивали один раз в жизни. */
    async function saveSession(token) {
      try { localStorage.setItem(MAX_KEY, token); } catch (e) {}
      try { document.cookie = `sara_session=${token}; path=/; max-age=15552000; SameSite=None; Secure`; } catch (e) {}
      await maxStoreSet(MAX_KEY, token);
    }

    /**
     * Автовход без участия человека: сначала стартовый параметр (токен из кнопки бота),
     * затем подпись мини-приложения. Возвращает true, если вошли.
     */
    async function tryAutoLogin() {
      const scan = bridgeScan();
      // отправляем отчёт о запуске — по нему налаживается автовход в конкретной сборке MAX
      fetch("/api/diag/bridge", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...scan, ua: navigator.userAgent.slice(0, 200), href: location.href.slice(0, 300) }),
      }).catch(() => {});

      // 1) токен из кнопки бота — он выдан лично этому аккаунту и проверяется у нас
      if (await loginWithToken(scan.startParam)) return true;
      // 2) подпись мини-приложения — вход по id пользователя в мессенджере
      if (await tryBridgeLogin()) return true;
      // 3) токен с прошлого запуска — в хранилище мессенджера он переживает перезапуск
      return loginWithToken(await maxStoreGet(MAX_KEY));
    }

    /** Проверяем токен на сервере и, если он живой, входим. */
    async function loginWithToken(token) {
      if (!token || token.length < 16) return false;
      try {
        const r = await fetch("/api/me", { headers: { "X-Max-Session": token } });
        if (!r.ok) return false;
        await saveSession(token);
        location.replace("/app?max=" + encodeURIComponent(token));
        return true;
      } catch (e) {
        return false;
      }
    }

    /** Пробуем войти по подписи мини-приложения. true — вошли, страница перезагрузится. */
    async function tryBridgeLogin() {
      const raw = bridgeInitData();
      if (!raw) return false;
      try {
        const res = await fetch("/api/auth/max", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: raw }),
        });
        if (!res.ok) return false;
        const d = await res.json();
        if (!d.token) return false;
        await saveSession(d.token);
        location.reload();
        return true;
      } catch (e) {
        return false;
      }
    }

    /** Экран входа: код из чата с ботом. */
    function renderLogin(note) {
      view.innerHTML = `
        <div class="card" style="padding:18px;text-align:center">
          <img src="${SARA}" alt="" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin:2px auto 12px">
          <div style="font-size:17px;font-weight:700;margin-bottom:6px">Сара пока не узнала тебя</div>
          <div style="color:var(--muted);font-size:13.5px;line-height:1.45;margin-bottom:16px">
            Открой приложение кнопкой <b>«📲 Открыть»</b> в чате с Сарой — дальше вход запомнится, и это окно больше не появится.
          </div>
          <button class="btn primary" style="width:100%;margin-bottom:8px" onclick="openBotChat()">Открыть чат с Сарой</button>
          <button class="btn" style="width:100%" onclick="retryLogin()">Попробовать ещё раз</button>
          <div id="login-msg" style="color:var(--muted);font-size:12.5px;min-height:18px;margin-top:10px">${note ? esc(note) : ""}</div>
          <div id="login-diag" style="color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px;text-align:left;white-space:pre-wrap;word-break:break-all;opacity:.85"></div>
          <div id="login-build" style="color:var(--muted);font-size:11px;margin-top:6px;opacity:.7"></div>
        </div>`;
      fetch("/version", { cache: "no-store" })
        .then((r) => r.text())
        .then((v) => { const el = $("login-build"); if (el) el.textContent = "сборка " + v; })
        .catch(() => {});
      showLoginDiag();
    }

    /** Что страница увидела при запуске — по этим строкам налаживается вход без кодов. */
    function showLoginDiag() {
      const el = $("login-diag");
      if (!el) return;
      const scan = bridgeScan();
      el.textContent = [
        "мосты: " + (Object.keys(scan.bridges).join(", ") || "нет"),
        "подпись: " + (scan.initData ? scan.initData.length + " симв. [" + scan.initKeys + "]" : "нет"),
        "токен: " + (scan.startParam ? scan.startParam.length + " симв." : "нет"),
        "параметры: " + (Object.keys(scan.params).join(", ") || "нет"),
        "хеш: " + (scan.hash ? scan.hash.slice(0, 60) : "нет"),
      ].join("\n");
    }

    window.openBotChat = () => {
      try { tg.openLink("https://max.ru/se14086067_bot"); } catch (e) { location.href = "https://max.ru/se14086067_bot"; }
    };

    window.retryLogin = async () => {
      const msg = $("login-msg");
      if (msg) msg.textContent = "Проверяю…";
      if (await tryAutoLogin()) return;
      if (msg) msg.textContent = "Пока не вышло. Открой приложение кнопкой «📲 Открыть» в чате.";
    };

    (async () => {
      try {
        me = await api("/me");
        // настройки аккаунта: локальные уже применены, теперь забираем серверные
        try {
          const saved = await api("/prefs");
          prefs = { ...prefs, ...saved };
          localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
          applyPrefs();
        } catch (e) {}
        applyGreeting();
        if (me.role === "owner") $("admin-btn").style.display = "";
        // Личный аккаунт — без клиентской базы владельца
        if (me.role === "client") {
          const cl = document.querySelector('.nav a[data-tab="clients"]');
          if (cl) cl.remove();
        }
        // имя ассистента: в шапке, в нижнем меню и в заголовке вкладки
        if (prefs.botName && prefs.botName !== "Сара") {
          const navAi = document.querySelector('.nav a[data-tab="ai"]');
          if (navAi) navAi.lastChild.textContent = prefs.botName;
          TAB_NAMES.ai = prefs.botName;
        }
      } catch (e) {
        const m = String(e.message || e);
        if (m === "unauthorized") {
          // Открыли кнопкой мини-приложения в MAX: сначала пробуем подпись, иначе — код из чата
          if (await tryAutoLogin()) return;
          renderLogin("");
        } else {
              view.innerHTML = emptyBox("Нет доступа", "Открой приложение из своего бота и получи доступ у владельца.");
        }
        return;
      }
      // открываем тот экран, который выбран в настройках
      const start = prefs.hidden.includes(prefs.startTab) ? "home" : prefs.startTab;
      tab = start; navStack.length = 0; navStack.push(start);
      applyHiddenTabs();
      renderTab(start); updateBack();
      if (window.__appBooted) window.__appBooted();
    })();
  </script>
</body>
</html>
