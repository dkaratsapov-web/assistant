name = "assistant"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# Статика Mini App (интерфейс) — отдаётся с этого же воркера
assets = { directory = "./public", binding = "ASSETS" }

# База данных D1 (SQLite). ID подставится после `wrangler d1 create assistant-db`
# или создастся автоматически при первом деплое через дашборд.
[[d1_databases]]
binding = "DB"
database_name = "assistant-db"
database_id = "da843004-b80f-4534-8945-61bfb6f5a7c3"

# Фоновые задачи: напоминания (каждые 5 минут) и утренний дайджест (ежечасная проверка)
[triggers]
crons = ["*/5 * * * *", "0 * * * *"]

[vars]
# Несекретные настройки. Секретами задаются: BOT_TOKEN, OWNER_ID, WEBHOOK_SECRET,
# ANTHROPIC_API_KEY (ИИ), YANDEX_API_KEY + YANDEX_FOLDER_ID (голос). См. README.
ANTHROPIC_MODEL = "claude-sonnet-5"  # модель ИИ Claude
# YANDEX_FOLDER_ID = "..."           # каталог Yandex Cloud для SpeechKit (можно секретом)
TZ_OFFSET = "3"       # смещение часового пояса от UTC (Москва = 3)
DIGEST_HOUR = "9"     # час утреннего дайджеста по местному времени
