<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:500px;height:500px;overflow:hidden;background:#6a4fee}

</style></head><body>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B4BE8"/>
      <stop offset="55%" stop-color="#7B57F0"/>
      <stop offset="100%" stop-color="#37C2CC"/>

  <!-- облачко диалога с хвостиком -->

    <path d="M136 116h228c26.5 0 48 21.5 48 48v152c0 26.5-21.5 48-48 48H248l-64 46c-9 6.5-21 0-21-11v-35h-27c-26.5 0-48-21.5-48-48V164c0-26.5 21.5-48 48-48z" fill="#ffffff"/>

  <text x="250" y="291" font-family="'DejaVu Sans','Liberation Sans',Arial,Helvetica,sans-serif"
        font-size="168" font-weight="700" fill="#5B4BE8" text-anchor="middle" letter-spacing="-2">S</text>

</svg>
